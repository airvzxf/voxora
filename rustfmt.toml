# rustfmt configuration — closes #77 and #86.
#
# Two orthogonal settings that together make `cargo fmt --all --check`
# hermetic across local and CI rustfmt versions:
#
# `reorder_imports = false` (closes #77)
# Phase 4 PR #66 (voxora-core 0.3.1 deprecation patch) failed fmt-check
# because rustfmt 1.9+ alphabetises `use voxora_engine::*` and
# `use voxora_traits::*` across crate boundaries; the follow-up commit
# 23091b9 manually applied the reordering, but every future import
# edit reintroduces the divergence unless this is pinned. Side effect
# to be aware of: `reorder_imports = false` also disables the
# in-brace sort of `use foo::{B, A, C}` identifiers — rustfmt will
# leave whatever order the contributor wrote. This is documented
# rustfmt behaviour; AGENTS.md → Coding conventions is what keeps
# the workspace consistent; the formatter is no longer the guard.
#
# `style_edition = "2024"` (closes #86)
# Freezes rustfmt's semantics against binary-version drift. The CI
# workflow used to pin `toolchain: stable`, which let rustfmt itself
# roll forward over time; a future rustfmt 1.10+ tweak to any default
# heuristic (e.g. `use_small_heuristics` rewrapping long `use
# voxora_traits::{...}` blocks in voxora-engine/src/testing.rs,
# voxora-qwen3asr/src/engine.rs, voxora-whisper/src/engine.rs — the
# diff reproduced empirically against this workspace) re-introduces
# the same PR-blocking divergence for unrelated code. The two settings
# are orthogonal: `style_edition` governs formatting semantics,
# `reorder_imports` governs import ordering; KEEP BOTH.
#
# `rust-toolchain.toml` at the workspace root pins the channel to
# 1.98.1 so local and CI resolve to the same rustfmt + clippy.
# Bump both files together when the toolchain pin moves.
reorder_imports = false
style_edition = "2024"
