# Pin to the 1.8-era "preserve insertion order" import behaviour so
# that `cargo fmt --all --check` gives the same result on local
# rustfmt (whatever version a contributor happens to have installed)
# and on CI's pinned stable rustfmt.
#
# Phase 4 PR #66 (voxora-core 0.3.1 deprecation patch) failed
# fmt-check because rustfmt 1.9+ alphabetises `use voxora_engine::*`
# and `use voxora_traits::*` across crate boundaries; the follow-up
# commit 23091b9 manually applied the reordering, but every future
# import edit reintroduces the divergence unless this is pinned.
#
# Side effect to be aware of: `reorder_imports = false` also
# disables the in-brace sort of `use foo::{B, A, C}` identifiers —
# rustfmt will leave whatever order the contributor wrote. This is
# documented rustfmt behaviour. AGENTS.md → Coding conventions
# (and the existing `cargo fmt --all --check` T0 check) is what
# keeps the workspace consistent; the formatter is no longer the
# guard.
#
# Closes #77. Drop after rustfmt's `reorder_imports` default is
# the policy we want across local and CI.
reorder_imports = false
