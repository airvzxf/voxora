[package]
name = "voxora-registry"
# Bumped 0.5.3 → 0.5.4 for EPIC #148 (closes #143, #144). The
# Local arm of `ModelId::parse` is hardened (mirrors the HF
# arm's #102 guard: rejects `..` segments, embedded control
# characters, and ids longer than 4 KiB). The version pin
# moves in lockstep with `voxora-local` and `voxora-traits`
# per `AGENTS.md` → Version coordination.
#
# 0.4.1 was the previous docs-only patch release; 0.4.2 was the
# EPIC #100 CI hardening coordinated patch; 0.4.3 was the EPIC
# #109 security hardening coordinated patch; 0.4.0 was the Fase
# 4 coordinated cut that removed the `voxora-core` shim and
# bundles the `-suffix` Qwen3-ASR descriptor matching from PR B.
#
# 0.5.0 was the EPIC #117 coordinated minor bump.
# 0.5.1 was the EPIC #124 coordinated patch.
# 0.5.2 was the EPIC #133 coordinated patch.
# 0.5.3 was the EPIC #120 coordinated patch (Local-arm accept
# descriptor + chained-source helper).
version = "0.5.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Central model registry for voxora (ASR-specific). Resolves a model id to (EngineDescriptor, ModelDir) without lex-sort heuristics."
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"
# Disables cargo's default auto-discovery of `benches/*.rs` as
# separate bench targets. The bench-local helper module
# `in_memory_source.rs` would otherwise be compiled into its
# own empty test binary (no `#[bench]` fn, no `criterion_main`),
# which `cargo bench --workspace` then wastes a build slot on.
# Stable since Cargo 1.74 (MSRV 1.88).
autobenches = false

[dependencies]
voxora-traits = { workspace = true }
voxora-engine = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = "1"
thiserror     = { version = "2", default-features = false }
async-trait   = "0.1"

[features]
# Default features include the HF adapter so the canonical
# `Registry::with_builtin_descriptors()` works out of the box.
default = ["hf"]

hf = ["dep:voxora-hf"]

# Local-fallback chain (closes #120): pulls in `voxora-local` so
# `Registry::with_builtin_descriptors_and_chained_source(local_root)`
# can register the Local-id descriptor and wrap the registry's
# `source` with `voxora_local::ChainedSource`. Opt-in (NOT in
# `default`) so the slim `voxora-registry` build does not pay the
# `voxora-local` / `voxora-hf` transitive cost on its own. Note:
# the helper itself also needs the `hf` feature (it builds
# `HuggingFaceSource::new()`); a downstream consumer on
# `--no-default-features --features local` would need to enable
# `hf` as well to compile the helper.
local = ["dep:voxora-local"]

[dependencies.voxora-hf]
workspace = true
optional = true

[dependencies.voxora-local]
workspace = true
optional = true

[dev-dependencies]
tempfile          = "3"
tokio            = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock          = "0.6"
pretty_assertions = "1"
# EPIC #133 (PR #56): criterion harness for the
# `#[ignore]`-gated resolve bench in `benches/resolve.rs`.
criterion = { workspace = true }

[[bench]]
name = "resolve"
harness = false

[[example]]
name = "registry_resolve"
required-features = ["hf"]

# Closes #93. Only `hf` is gated; no hardware backends, so
# `all-features = true` is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]