[package]
name = "voxora-registry"
# Coordinated bump to 0.5.0 for EPIC #117: the central resolver
# surface is unchanged in this release (no API additions, no
# removals); only the `registry_resolve` example is added under
# the existing `hf` feature. Every workspace crate that
# participates in this release ships at 0.5.0 per
# `AGENTS.md` → Version coordination.
#
# 0.4.1 was the previous docs-only patch release; 0.4.2 was the
# EPIC #100 CI hardening coordinated patch; 0.4.3 was the EPIC
# #109 security hardening coordinated patch; 0.4.0 was the Fase
# 4 coordinated cut that removed the `voxora-core` shim and
# bundles the `-suffix` Qwen3-ASR descriptor matching from PR B.
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Central model registry for voxora (ASR-specific). Resolves a model id to (EngineDescriptor, ModelDir) without lex-sort heuristics."
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[dependencies]
voxora-traits = { workspace = true }
voxora-engine = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = "1"
thiserror     = { version = "2", default-features = false }
async-trait   = "0.1"

[features]
# Default features include the HF adapter so the canonical
# `Registry::with_builtin_descriptors()` works out of the box.
default = ["hf"]

hf = ["dep:voxora-hf"]

[dependencies.voxora-hf]
workspace = true
optional = true

[dev-dependencies]
tempfile          = "3"
tokio            = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock          = "0.6"
pretty_assertions = "1"

[[example]]
name = "registry_resolve"
required-features = ["hf"]

# Closes #93. Only `hf` is gated; no hardware backends, so
# `all-features = true` is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]