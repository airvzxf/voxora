[package]
name = "voxora-registry"
# Pinned to 0.2.0: coordinated Fase 2 release. Bundles the
# `-suffix` Qwen3-ASR descriptor matching from PR B and the central
# resolver.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Central model registry for voxora (ASR-specific). Resolves a model id to (EngineDescriptor, ModelDir) without lex-sort heuristics."
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[dependencies]
voxora-traits = { workspace = true }
voxora-engine = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = "1"
thiserror     = { version = "2", default-features = false }
async-trait   = "0.1"

[features]
# Default features include the HF adapter so the canonical
# `Registry::with_builtin_descriptors()` works out of the box.
default = ["hf"]

hf = ["dep:voxora-hf"]

[dependencies.voxora-hf]
workspace = true
optional = true

[dev-dependencies]
tempfile          = "3"
tokio            = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock          = "0.6"
pretty_assertions = "1"