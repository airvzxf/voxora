[package]
name = "voxora-local"
# Bumped 0.5.1 → 0.5.2 for EPIC #148 (closes #143, #144). The
# `LocalSource::resolve` hardening (path-traversal guard,
# symlink-following refusal, `O_NOFOLLOW` open, caller-imposed
# `ResolveOptions::max_bytes` / `max_id_length`, opaque `Debug`
# impl) is the coordinated patch release for this crate; the
# workspace pins for `voxora-traits` and `voxora-registry`
# flip in lockstep.
version = "0.5.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local directory model source for voxora (implements voxora_traits::ModelSource)"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
# No features today. The crate is intentionally minimal: the
# pre-`voxora-config` cascade for HF tokens is irrelevant here, and
# capability introspection is a static `ModelCapabilities::UNKNOWN`
# by design (a directory listing cannot synthesise engine metadata
# without reading config.json, which the caller can do explicitly
# via `capabilities_for` if it wants a richer answer).

[dependencies]
voxora-traits = { workspace = true }
async-trait   = "0.1"
thiserror     = { version = "2", default-features = false }

# `libc` is gated to Unix because the O_NOFOLLOW constant only
# exists there. Pulling it as a direct dep (rather than relying on
# `std::os::unix::fs::OpenOptionsExt::custom_flags` to infer the
# value via `nix` or `rustix`) keeps the surface tight: the
# security hardening (closes #143, EPIC #148) is exactly one
# `libc::O_NOFOLLOW` flag on the open call. The crate is already
# in `Cargo.lock` transitively via `tempfile` (dev-dep) and any
# `getrandom` / `rustix` chain; this direct dep is therefore
# lockfile-neutral — no new transitive churn.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile          = "3"
pretty_assertions = "1"

# Closes #93. No hardware backends, no engine forwards; the only
# feature in this crate is the absence of one, so `all-features = true`
# is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
