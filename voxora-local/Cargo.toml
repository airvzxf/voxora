[package]
name = "voxora-local"
# Explicit 0.5.1 override — does **not** participate in the
# EPIC #133 (0.5.2) coordinated bump. Per `AGENTS.md` § "Version
# coordination" additive-exception path, crates that did not
# change AND are not in the release notes stay at their current
# version. Voxora-local had no surface change in #134/#135/#136/#138.
# (Previously inherited `[workspace.package]` version; pinned
# here so the workspace can flip to 0.5.2 without dragging this
# crate along.)
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local directory model source for voxora (implements voxora_traits::ModelSource)"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
# No features today. The crate is intentionally minimal: the
# pre-`voxora-config` cascade for HF tokens is irrelevant here, and
# capability introspection is a static `ModelCapabilities::UNKNOWN`
# by design (a directory listing cannot synthesise engine metadata
# without reading config.json, which the caller can do explicitly
# via `capabilities_for` if it wants a richer answer).

[dependencies]
voxora-traits = { workspace = true }
async-trait   = "0.1"
thiserror     = { version = "2", default-features = false }

[dev-dependencies]
tempfile          = "3"
pretty_assertions = "1"

# Closes #93. No hardware backends, no engine forwards; the only
# feature in this crate is the absence of one, so `all-features = true`
# is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
