[workspace]
resolver = "2"
members = [
    "voxora-traits",
    "voxora-config",
    "voxora-hf",
    "voxora-whisper",
    "voxora-qwen3asr",
    "voxora-bridge",
    "voxora-cli",
    "voxora-engine",
    "voxora-backend",
    "voxora-registry",
    "voxora-testkit",
    "voxora-local",
    "voxora-vad",
]

[workspace.package]
# Bumped to 0.4.0 for Fase 4 (PR 3): the workspace is now 11
# crates — the `voxora-core` compatibility shim (0.3.0 / 0.3.1)
# is deleted; the canonical trait surface lives in `voxora-traits`
# and is what every voxora-* crate consumes. Every participating
# workspace crate ships at 0.4.0 per the coordinated version
# policy documented in `AGENTS.md` → Version coordination.
# `voxora-cli` and `voxora-testkit` are dev-only (`publish = false`)
# but still track the workspace version for local builds.
#
# Bumped to 0.4.2 for EPIC #100 (PR #105): coordinated patch
# release covering the MSRV bump (1.86 → 1.88, real floor was
# raised by whisper-rs-sys 0.15.0 — no API change), the CI
# hardening (#99 tracked-artifact guard, #96 yanked-deps
# enforcement, #95 single-engine doc matrix, #92 MSRV check job,
# #93 docs.rs metadata, #94 partial-release guard), and the F2
# follow-ups (collapsible_if fixes, stale doc references,
# workspace.dependencies alignment). Per `AGENTS.md` § Version
# coordination, all 11 participating crates ship at 0.4.2; the
# 0.4.1 partial release on voxora-traits/registry/bridge (PR #97
# docs-only) remains on crates.io as a separate tag.
version = "0.4.3"
edition = "2024"
# SPDX license expression is sufficient — crates.io displays the
# license from this field. Including the full LICENSE text in every
# published crate would require either symlinks in each member
# directory or per-member `license-file = "../LICENSE"`, which is
# noise for a standard Apache-2.0 SPDX declaration.
license = "Apache-2.0"
repository = "https://github.com/airvzxf/voxora"
description = "Model-agnostic Speech-to-Text for Rust"
authors = ["Israel Alberto Roldan Vega <israel.alberto.rv@gmail.com>"]
rust-version = "1.88"
readme = "README.md"
keywords = ["asr", "speech-recognition", "transcription", "whisper", "voxora"]
# `science::linguistics` was retired from crates.io — keep just the
# two slugs that survived: api-bindings (voxora-hf wraps the HF API)
# and multimedia::audio (every voxora engine processes audio).
categories = ["api-bindings", "multimedia::audio"]
# publish defaults to true when absent. Setting it explicitly here
# makes the intent obvious in `cargo metadata` and protects against
# future workspace.package additions accidentally inheriting a
# publish = false from somewhere else.
publish = true

# Internal workspace deps. Each voxora-* crate references these
# via `voxora_core.workspace = true` so the version is explicit
# (mandatory for publishing) while the path keeps local builds
# working. cargo strips the path on `cargo publish` and uses the
# version instead.
[workspace.dependencies]
# Internal voxora-* deps. Every voxora-* crate references these via
# `voxora_X.workspace = true` so the version is explicit (mandatory
# for publishing) while the path keeps local builds working. cargo
# strips the path on `cargo publish` and uses the version instead.
#
# Aligned to 0.4.2 for EPIC #100 (PR #105). All 11 workspace crates
# ship at 0.4.2 in this coordinated patch release; the previous
# partial 0.4.1 on voxora-traits/registry/bridge (commit ecbfd2e,
# docs-only patch from PR #97) remains on crates.io as separate
# tag — caret semver accepts ^0.4.1 → 0.4.2 transitively so no
# Cargo.lock churn.
voxora-traits   = { path = "voxora-traits",   version = "0.4.3" }
voxora-config   = { path = "voxora-config",   version = "0.4.3" }
voxora-hf       = { path = "voxora-hf",       version = "0.4.3" }
voxora-whisper  = { path = "voxora-whisper",  version = "0.4.3" }
voxora-qwen3asr = { path = "voxora-qwen3asr", version = "0.4.3" }
voxora-engine    = { path = "voxora-engine",    version = "0.4.3" }
voxora-backend   = { path = "voxora-backend",   version = "0.4.3" }
voxora-registry  = { path = "voxora-registry",  version = "0.4.3" }
voxora-testkit   = { path = "voxora-testkit",   version = "0.4.3" }
voxora-bridge    = { path = "voxora-bridge",    version = "0.4.3" }
voxora-cli       = { path = "voxora-cli",       version = "0.4.3" }
voxora-local     = { path = "voxora-local",     version = "0.4.3" }
voxora-vad       = { path = "voxora-vad",       version = "0.5.0" }

# Third-party deps shared through the workspace. Only the ones a member
# opts into with `workspace = true` are pinned here; the rest stay in
# each member's own `[dependencies]`.
serde           = { version = "1" }
candle-core     = { version = "0.9", default-features = false }
