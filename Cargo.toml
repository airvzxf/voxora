[workspace]
resolver = "2"
members = [
    "voxora-traits",
    "voxora-config",
    "voxora-hf",
    "voxora-whisper",
    "voxora-qwen3asr",
    "voxora-bridge",
    "voxora-cli",
    "voxora-engine",
    "voxora-backend",
    "voxora-registry",
    "voxora-testkit",
    "voxora-local",
    "voxora-vad",
]

[workspace.package]
# Bumped to 0.4.0 for Fase 4 (PR 3): the workspace is now 11
# crates — the `voxora-core` compatibility shim (0.3.0 / 0.3.1)
# is deleted; the canonical trait surface lives in `voxora-traits`
# and is what every voxora-* crate consumes. Every participating
# workspace crate ships at 0.4.0 per the coordinated version
# policy documented in `AGENTS.md` → Version coordination.
# `voxora-cli` and `voxora-testkit` are dev-only (`publish = false`)
# but still track the workspace version for local builds.
#
# Bumped to 0.4.2 for EPIC #100 (PR #105): coordinated patch
# release covering the MSRV bump (1.86 → 1.88, real floor was
# raised by whisper-rs-sys 0.15.0 — no API change), the CI
# hardening (#99 tracked-artifact guard, #96 yanked-deps
# enforcement, #95 single-engine doc matrix, #92 MSRV check job,
# #93 docs.rs metadata, #94 partial-release guard), and the F2
# follow-ups (collapsible_if fixes, stale doc references,
# workspace.dependencies alignment). Per `AGENTS.md` § Version
# coordination, all 11 participating crates ship at 0.4.2; the
# 0.4.1 partial release on voxora-traits/registry/bridge (PR #97
# docs-only) remains on crates.io as a separate tag.
#
# Bumped to 0.4.3 for EPIC #109 (PR #115): coordinated patch
# release for the 0.4.3 security hardening.
#
# EPIC #117 content PR (#118) landed at 0.4.3 to match the
# workspace pin already on crates.io (the per-crate `cargo
# package` CI gate needs every internal dep to resolve at the
# tagged semver, and the new crates voxora-vad / voxora-local
# needed their first publish to clear before the bump could
# pass). The coordinated 0.5.0 minor bump ships here on the
# `release/0.5.0` branch (mirrors the PR #115 / PR #116 split
# used for EPIC #109). Every workspace crate that participates
# ships at 0.5.0; consumers writing
# `voxora-traits = "0.5", voxora-bridge = "0.5", voxora-local = "0.5", voxora-vad = "0.5"`
# get the matching set.
#
# EPIC #124 (closes #119, #121, #122) ships the kind/publish
# guard extension, the voxora-cli vulkan + --hardware surface, and
# the Waker::noop() refactor as a **content-only** change on
# top of the existing 0.5.0 cut. The coordinated 0.5.1 patch
# bump ships as a separate follow-up commit on the same branch
# (mirrors PR #115 / PR #116's content-then-bump split). Until
# that follow-up lands, every workspace crate stays at 0.5.0;
# consumers writing the matching `voxora-* = "0.5"` set keep
# resolving against the 0.5.0 already on crates.io.
#
# Follow-up commit on the same branch bumps the coordinated
# workspace version to 0.5.1. Every workspace crate that
# participates ships at 0.5.1; consumers writing
# `voxora-traits = "0.5", voxora-bridge = "0.5", voxora-local = "0.5", voxora-vad = "0.5"`
# get the matching set.
#
# Bumped to 0.5.2 for EPIC #133 (PR #139): coordinated **patch**
# release for the quality-hardening sweep. EPIC #133 ships via
# four additive PRs — #134 (criterion benchmark suite + CI
# compile-only check), #135 (cross-engine parity matrix via
# voxora-bridge), #136 (cargo-fuzz infrastructure), #138
# (quality follow-ups). Per `AGENTS.md` § "Version coordination"
# only the 7 participating crates ship at 0.5.2:
# voxora-traits, voxora-engine, voxora-registry, voxora-whisper,
# voxora-qwen3asr, voxora-testkit (publish = false), voxora-bridge.
# voxora-local, voxora-hf, voxora-config, voxora-vad,
# voxora-backend, voxora-cli stay at 0.5.1 (no surface change,
# additive-exception path). No API changes.
#
# EPIC #148 (closes #143, #144) is the security-hardening patch
# release that follows EPIC #133. Only 3 crates participate:
# voxora-local 0.5.1 → 0.5.2 (LocalSource hardening), voxora-traits
# 0.5.2 → 0.5.3 (ResolveOptions::max_bytes / max_id_length),
# voxora-registry 0.5.3 → 0.5.4 (ModelId::parse Local arm
# hardening). The remaining 8 crates stay at their current
# versions per the additive-exception path.
#
# Bumped `voxora-bridge` only to 0.5.3 for issue #145 — a
# bridge-only patch release that adds the new `registry` Cargo
# feature (`pub use voxora_registry::{Registry, RegistryHfExt,
# builtin_local_descriptor}` at the umbrella level). No public
# API change in any other crate; the workspace pin stays at
# 0.5.2 because the bump is scoped to the umbrella's re-export
# surface (additive-exception path).
version = "0.5.2"
edition = "2024"
# SPDX license expression is sufficient — crates.io displays the
# license from this field. Including the full LICENSE text in every
# published crate would require either symlinks in each member
# directory or per-member `license-file = "../LICENSE"`, which is
# noise for a standard Apache-2.0 SPDX declaration.
license = "Apache-2.0"
repository = "https://github.com/airvzxf/voxora"
description = "Model-agnostic Speech-to-Text for Rust"
authors = ["Israel Alberto Roldan Vega <israel.alberto.rv@gmail.com>"]
rust-version = "1.88"
readme = "README.md"
keywords = ["asr", "speech-recognition", "transcription", "whisper", "voxora"]
# `science::linguistics` was retired from crates.io — keep just the
# two slugs that survived: api-bindings (voxora-hf wraps the HF API)
# and multimedia::audio (every voxora engine processes audio).
categories = ["api-bindings", "multimedia::audio"]
# publish defaults to true when absent. Setting it explicitly here
# makes the intent obvious in `cargo metadata` and protects against
# future workspace.package additions accidentally inheriting a
# publish = false from somewhere else.
publish = true

# Internal workspace deps. Each voxora-* crate references these
# via `voxora_core.workspace = true` so the version is explicit
# (mandatory for publishing) while the path keeps local builds
# working. cargo strips the path on `cargo publish` and uses the
# version instead.
[workspace.dependencies]
# Internal voxora-* deps. Every voxora-* crate references these via
# `voxora_X.workspace = true` so the version is explicit (mandatory
# for publishing) while the path keeps local builds working. cargo
# strips the path on `cargo publish` and uses the version instead.
#
# Aligned to 0.4.2 for EPIC #100 (PR #105). All 11 workspace crates
# ship at 0.4.2 in this coordinated patch release; the previous
# partial 0.4.1 on voxora-traits/registry/bridge (commit ecbfd2e,
# docs-only patch from PR #97) remains on crates.io as separate
# tag — caret semver accepts ^0.4.1 → 0.4.2 transitively so no
# Cargo.lock churn.
voxora-traits  = { path = "voxora-traits", version = "0.5.3" }
voxora-config  = { path = "voxora-config", version = "0.5.1" }
voxora-hf      = { path = "voxora-hf", version = "0.5.1" }
voxora-whisper = { path = "voxora-whisper", version = "0.5.2" }
voxora-qwen3asr = { path = "voxora-qwen3asr", version = "0.5.2" }
voxora-engine  = { path = "voxora-engine", version = "0.5.2" }
voxora-backend = { path = "voxora-backend", version = "0.5.1" }
voxora-registry = { path = "voxora-registry", version = "0.5.4" }
voxora-testkit = { path = "voxora-testkit", version = "0.5.2" }
voxora-bridge  = { path = "voxora-bridge", version = "0.5.3" }
voxora-cli     = { path = "voxora-cli", version = "0.5.1" }
voxora-local   = { path = "voxora-local", version = "0.5.2" }
voxora-vad     = { path = "voxora-vad", version = "0.5.1" }
# Third-party deps shared through the workspace. Only the ones a member
# opts into with `workspace = true` are pinned here; the rest stay in
# each member's own `[dependencies]`.
serde           = { version = "1" }
candle-core     = { version = "0.9", default-features = false }
# Criterion benchmark harness. EPIC #133 (PR #56) introduces a
# workspace-wide `cargo bench --workspace --no-run` compile check
# and per-crate benches; pinning the version here keeps the
# bencher consistent across crates. `default-features = false`
# disables the rayon-backed plotting feature set so the benches
# stay runnable on the bare metal CI runners that compile the
# workspace.
criterion       = { version = "0.8", default-features = false }
