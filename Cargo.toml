[workspace]
resolver = "2"
members = [
    "voxora-core",
    "voxora-traits",
    "voxora-config",
    "voxora-hf",
    "voxora-whisper",
    "voxora-qwen3asr",
    "voxora-bridge",
    "voxora-cli",
    "voxora-engine",
    "voxora-backend",
    "voxora-registry",
    "voxora-testkit",
]

[workspace.package]
# Bumped to 0.3.0 for Fase 3: voxora-traits is the new canonical home
# of the trait surface and value types; voxora-core 0.3.0 is a thin
# shim that re-exports it. Phase 4 (PR 1) brings voxora-engine into
# lock-step at 0.3.0 per the coordinated version policy documented
# in `AGENTS.md` → Version coordination. The remaining
# hardcoded-version crates (voxora-config, voxora-hf, voxora-whisper,
# voxora-qwen3asr, voxora-backend, voxora-registry) stay at 0.2.0 in
# this PR — they will move to 0.4.0 in the breaking-removal PR #42
# together with the deletion of the voxora-core shim. voxora-testkit
# also moved to 0.3.0 in PR C (real-fixtures surface).
version = "0.3.0"
edition = "2024"
# SPDX license expression is sufficient — crates.io displays the
# license from this field. Including the full LICENSE text in every
# published crate would require either symlinks in each member
# directory or per-member `license-file = "../LICENSE"`, which is
# noise for a standard Apache-2.0 SPDX declaration.
license = "Apache-2.0"
repository = "https://github.com/airvzxf/voxora"
description = "Model-agnostic Speech-to-Text for Rust"
authors = ["Israel Alberto Roldan Vega <israel.alberto.rv@gmail.com>"]
rust-version = "1.86"
readme = "README.md"
keywords = ["asr", "speech-recognition", "transcription", "whisper", "voxora"]
# `science::linguistics` was retired from crates.io — keep just the
# two slugs that survived: api-bindings (voxora-hf wraps the HF API)
# and multimedia::audio (every voxora engine processes audio).
categories = ["api-bindings", "multimedia::audio"]
# publish defaults to true when absent. Setting it explicitly here
# makes the intent obvious in `cargo metadata` and protects against
# future workspace.package additions accidentally inheriting a
# publish = false from somewhere else.
publish = true

# Internal workspace deps. Each voxora-* crate references these
# via `voxora_core.workspace = true` so the version is explicit
# (mandatory for publishing) while the path keeps local builds
# working. cargo strips the path on `cargo publish` and uses the
# version instead.
[workspace.dependencies]
voxora-core     = { path = "voxora-core",     version = "0.3.0" }
voxora-traits   = { path = "voxora-traits",   version = "0.3.0" }
voxora-config   = { path = "voxora-config",   version = "0.2.0" }
voxora-hf       = { path = "voxora-hf",       version = "0.2.0" }
voxora-whisper  = { path = "voxora-whisper",  version = "0.2.0" }
voxora-qwen3asr = { path = "voxora-qwen3asr", version = "0.2.0" }
voxora-engine    = { path = "voxora-engine",    version = "0.3.0" }
voxora-backend   = { path = "voxora-backend",   version = "0.3.0" }
voxora-registry  = { path = "voxora-registry",  version = "0.2.0" }
voxora-testkit   = { path = "voxora-testkit",   version = "0.3.0" }
voxora-bridge    = { path = "voxora-bridge",    version = "0.3.0" }
voxora-cli       = { path = "voxora-cli",       version = "0.3.0" }

# Third-party deps shared through the workspace. Only the ones a member
# opts into with `workspace = true` are pinned here; the rest stay in
# each member's own `[dependencies]`.
serde           = { version = "1" }
candle-core     = { version = "0.9", default-features = false }
