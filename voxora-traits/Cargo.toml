[package]
name = "voxora-traits"
# 0.4.1 patch release: docs-only — see CHANGELOG. Per AGENTS.md
# "Version coordination", the coordinated-bump rule applies only
# to X.Y.0 breaking releases; the other eight workspace crates
# stay at 0.4.0.
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical traits and value types for voxora (no runtime deps)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[features]
default = []
# Optional serde feature for serde Serialize/Deserialize derives on
# public types (mirrors the existing voxora-core `serde` feature).
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
thiserror   = { version = "2", default-features = false }
serde       = { version = "1", optional = true, features = ["derive"] }
serde_json  = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

# Closes #93. `serde` is the only gated feature and no source
# attribute currently `#[cfg(feature = "serde")]`-gates anything;
# adding the metadata block now so future gates land with the badge
# plumbing already in place.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]