[package]
name = "voxora-traits"
# Stays at 0.4.3 for the EPIC #117 content PR (matches the
# workspace pin that's already on crates.io). The trait surface
# is unchanged in this release (no API additions, no removals).
# The coordinated 0.5.0 bump ships as a separate follow-up
# commit once the EPIC #117 content merges to main.
#
# 0.4.1 was the previous docs-only patch release; 0.4.2 was the
# EPIC #100 CI hardening coordinated patch; 0.4.3 was the EPIC
# #109 security hardening coordinated patch.
version = "0.4.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical traits and value types for voxora (no runtime deps)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[features]
default = []
# Optional serde feature for serde Serialize/Deserialize derives on
# public types (mirrors the existing voxora-core `serde` feature).
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
thiserror   = { version = "2", default-features = false }
serde       = { version = "1", optional = true, features = ["derive"] }
serde_json  = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

# Closes #93. `serde` is the only gated feature and no source
# attribute currently `#[cfg(feature = "serde")]`-gates anything;
# adding the metadata block now so future gates land with the badge
# plumbing already in place.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]