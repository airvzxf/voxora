[package]
name = "voxora-traits"
# Bumped 0.5.2 → 0.5.3 for EPIC #148 (closes #143, #144). The
# `ResolveOptions::max_bytes` and `max_id_length` additions are
# additive (`#[non_exhaustive]` shields existing call sites; the
# default `None` values preserve today's behaviour), but the
# version pin moves in lockstep with `voxora-local` and
# `voxora-registry` per `AGENTS.md` → Version coordination.
#
# 0.4.1 was the previous docs-only patch release; 0.4.2 was the
# EPIC #100 CI hardening coordinated patch; 0.4.3 was the EPIC
# #109 security hardening coordinated patch.
version = "0.5.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical traits and value types for voxora (no runtime deps)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[features]
default = []
# Optional serde feature for serde Serialize/Deserialize derives on
# public types (mirrors the existing voxora-core `serde` feature).
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
thiserror   = { version = "2", default-features = false }
serde       = { version = "1", optional = true, features = ["derive"] }
serde_json  = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

# Closes #93. `serde` is the only gated feature and no source
# attribute currently `#[cfg(feature = "serde")]`-gates anything;
# adding the metadata block now so future gates land with the badge
# plumbing already in place.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]