[package]
name = "voxora-qwen3asr"
# Pinned to 0.2.0: coordinated Fase 2 release. Bundles the opt-in
# `engine-adapter` feature from PR A.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "qwen3-asr-rs engine adapter for voxora (implements voxora_traits::AsrEngine)"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = ["cpu"]
cpu    = []
metal  = ["qwen3-asr/metal"]
cuda   = ["qwen3-asr/cuda"]
hf     = ["dep:voxora-hf", "dep:serde_json", "dep:anyhow"]
# Adopt voxora_engine::EngineAdapter; opt-in to keep the existing
# surface minimal for consumers that don't need introspection.
engine-adapter = ["dep:voxora-engine"]

[dependencies]
voxora-traits = { workspace = true }
qwen3-asr     = { version = "0.2", default-features = false }
candle-core   = "0.9.2"
thiserror     = { version = "2", default-features = false }
voxora-hf     = { workspace = true, optional = true }
voxora-engine = { workspace = true, optional = true }
serde_json    = { version = "1", optional = true }
anyhow        = { version = "1", optional = true }

[[example]]
name = "transcribe_wav_qwen3asr"
required-features = ["hf"]

[dev-dependencies]
anyhow    = "1"
hound     = "3.5"
tempfile  = "3"
tokio     = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
ureq      = { version = "3", default-features = false, features = ["_tls", "rustls"] }

[[test]]
name = "parity"
required-features = ["hf"]

[[test]]
name = "concurrency"
required-features = ["hf"]