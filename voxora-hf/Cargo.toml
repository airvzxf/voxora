[package]
name = "voxora-hf"
# Explicit 0.5.1 override — does **not** participate in the
# EPIC #133 (0.5.2) coordinated bump. Per `AGENTS.md` § "Version
# coordination" additive-exception path, crates that did not
# change AND are not in the release notes stay at their current
# version. Voxora-hf had no surface change in #134/#135/#136/#138.
# (Previously inherited `[workspace.package]` version; pinned
# here so the workspace can flip to 0.5.2 without dragging this
# crate along.)
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hugging Face model source for voxora (implements voxora_traits::ModelSource)"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = ["config"]

# Use voxora-config as the single source of truth for the env-var
# cascade (cache root, HF token, HF base URL, default revision).
# Disable to fall back to the inline legacy cascade (read-only
# VOXORA_CACHE_DIR / HF_TOKEN / HUGGING_FACE_HUB_TOKEN) so crates
# that do not want voxora-config as a dependency can still use
# voxora-hf in isolation.
config = ["dep:voxora-config"]

[dependencies]
voxora-traits = { workspace = true }
async-trait   = "0.1"
thiserror     = { version = "2", default-features = false }
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest       = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
sha2          = "0.11"
futures-util  = "0.3"
dirs          = "5"
voxora-config = { workspace = true, optional = true }

[dev-dependencies]
wiremock          = "0.6"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile          = "3"
pretty_assertions = "1"

# Closes #93. Only `config` is gated; no hardware backends, so
# `all-features = true` is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
