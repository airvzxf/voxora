[package]
name = "voxora-hf"
# Patch-bumped to 0.6.2 for the advisory-lock fix landed in
# PR #207 (closes #185). Other workspace crates stay at 0.6.1
# per `AGENTS.md` § "Version coordination" additive-exception
# path: 0.6.2 is a single-crate patch release, the participating
# crate is voxora-hf only, and the release notes explain why the
# other crates stayed put. (Earlier comments above carried the
# 0.5.1 exception narrative for the 0.5.2 cycle; the crate has
# participated in every coordinated bump since, so the
# overriding version is the workspace default again. We keep the
# pin here to disambiguate.)
version = "0.6.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hugging Face model source for voxora (implements voxora_traits::ModelSource)"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = ["config"]

# Use voxora-config as the single source of truth for the env-var
# cascade (cache root, HF token, HF base URL, default revision).
# Disable to fall back to the inline legacy cascade (read-only
# VOXORA_CACHE_DIR / HF_TOKEN / HUGGING_FACE_HUB_TOKEN) so crates
# that do not want voxora-config as a dependency can still use
# voxora-hf in isolation.
config = ["dep:voxora-config"]

[dependencies]
voxora-traits = { workspace = true }
async-trait   = "0.1"
thiserror     = { version = "2", default-features = false }
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest       = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
sha2          = "0.11"
futures-util  = "0.3"
fs2           = "0.4"
dirs          = "5"
# Closes #210: `fs2::try_lock_exclusive` does not retry across
# `EINTR` — the raw `flock(2)` syscall surfaces it as
# `ErrorKind::Interrupted`. We need to detect `EINTR` explicitly
# to keep the lock-acquisition retry loop bounded; that detection
# uses `raw_os_error()`, which requires a direct `libc` dep
# (the transitive via `fs2` is not enough for `use libc::EINTR`).
libc           = { version = "0.2", features = ["std"] }
voxora-config = { workspace = true, optional = true }

[dev-dependencies]
wiremock          = "0.6"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile          = "3"
pretty_assertions = "1"

# Closes #93. Only `config` is gated; no hardware backends, so
# `all-features = true` is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
