[package]
name = "voxora-vad"
# Initial published release as part of the coordinated
# [EPIC #117](https://github.com/airvzxf/voxora/issues/117)
# 0.5.0 minor bump (closes
# [#48](https://github.com/airvzxf/voxora/issues/48)).
#
# Bumped 0.5.1 → 0.6.2 for EPIC #206 — the 0.6.2 reliability
# hardening sweep. Replaced the per-sample O(N) RMS recompute
# in `EnergyVad::next_segment` with an O(1) per-hop incremental
# sum-of-squares accumulator (PR #233, closes #194). The
# behaviour tests at lines 471-628 stay green (the math is
# bit-equivalent to a fresh recompute mod float ordering).
#
# Bumped 0.6.2 → 0.6.3 for EPIC #206 — coordinated patch
# re-alignment (PR #243). No source change this cycle; the bump
# is purely a workspace-pin update that re-aligns this crate
# after the `release-plz` Frankenstein in #242.
version = "0.6.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Energy-based voice activity detection (VAD) utility for voxora"
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
# Zero non-workspace runtime deps by design — the detector is
# pure f32 arithmetic over a sliding window, so the crate
# stays hermetic on a fresh `cargo build`. Matches the
# "tiny pure-Rust" stance of `voxora-config`.
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# Voxora-testkit ships the canonical 16 kHz PCM fixtures
# (SILENCE_1S, sine_440hz_500ms) used by the example and
# the integration tests. The fixtures are tiny (a `&[f32]`
# constant and a 30-line function) so we keep an inline
# copy in `src/fixtures.rs` instead of pulling the crate as
# a dev-dependency — voxora-testkit is `publish = false` and
# cargo publish cannot resolve workspace-only crates.
#
# The local fixtures are kept byte-identical to
# `voxora_testkit::audio::SILENCE_1S` and `sine_440hz_500ms`
# so a downstream consumer can swap the source trivially.
pretty_assertions = "1"

[package.metadata.docs.rs]
# The crate ships no optional features — every public item
# builds unconditionally. `all-features = true` is therefore
# the right docs.rs knob.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
