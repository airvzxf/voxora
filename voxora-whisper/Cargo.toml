[package]
name = "voxora-whisper"
# Version inherited from `[workspace.package]` (currently 0.4.0).
# The 0.4.0 coordinated Fase 4 release removes the `voxora-core`
# shim; this engine adapter consumes the trait surface via
# `voxora-traits` directly. Bundles the opt-in `engine-adapter`
# feature from PR A.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "whisper.cpp engine adapter for voxora (implements voxora_traits::AsrEngine)"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = ["cpu"]
cpu    = []
metal  = ["whisper-rs/metal"]
cuda   = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
hf     = ["dep:voxora-hf"]
# Adopt voxora_engine::EngineAdapter; opt-in to keep the existing
# surface minimal for consumers that don't need introspection.
engine-adapter = ["dep:voxora-engine"]

[dependencies]
voxora-traits = { workspace = true }
whisper-rs    = "0.16"
thiserror     = { version = "2", default-features = false }
voxora-hf     = { workspace = true, optional = true }
voxora-engine = { workspace = true, optional = true }

[dev-dependencies]
hound    = "3.5"
tempfile = "3"
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
ureq     = { version = "3", default-features = false, features = ["_tls", "rustls"] }

[[example]]
name = "transcribe_wav_whisper"
required-features = ["hf"]

# Closes #93. Explicit `features = [...]` (not `all-features = true`)
# so docs.rs skips the metal/cuda/vulkan backends (SDK-gated on the
# stock docs.rs sandbox); default `cpu` is the no-op backend so it
# is omitted from the explicit list.
[package.metadata.docs.rs]
features = ["hf", "engine-adapter"]
rustdoc-args = ["--cfg", "docsrs"]