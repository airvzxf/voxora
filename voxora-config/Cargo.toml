[package]
name = "voxora-config"
# Explicit 0.5.1 override — does **not** participate in the
# EPIC #133 (0.5.2) coordinated bump. Per `AGENTS.md` § "Version
# coordination" additive-exception path, crates that did not
# change AND are not in the release notes stay at their current
# version. Voxora-config had no surface change in #134/#135/#136/#138.
# (Previously inherited `[workspace.package]` version; pinned
# here so the workspace can flip to 0.5.2 without dragging this
# crate along.)
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration cascade for voxora (cache dir, Hugging Face token, base URL, revision)"
authors.workspace = true
rust-version.workspace = true
# Not `readme.workspace = true`: a workspace-inherited readme resolves
# against the workspace root, and this crate ships its own README
# describing the cascade and the VOXORA_* variables it honours.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
serde        = { workspace = true, features = ["derive"] }
toml         = "0.8"
dirs         = "5"
thiserror    = { version = "2", default-features = false }

[dev-dependencies]
tempfile          = "3"
pretty_assertions = "1"
