[package]
name = "voxora-config"
# Bumped to 0.6.0 for EPIC #153 (closes #156). Adds the new
# `MiniMaxConfig` section with the `MINIMAX_API_KEY` /
# `VOXORA_MINIMAX_API_KEY` cascade and the
# `VOXORA_MINIMAX_ENDPOINT` cascade. The new field is
# `#[serde(default)]` on `VoxoraConfig` so existing
# `voxora.toml` files without a `[minimax]` block keep parsing
# unchanged (per the additive-exception path documented in
# `AGENTS.md` § "Version coordination"). This crate participates
# in the 0.6.0 coordinated bump alongside `voxora-engine`,
# `voxora-bridge`, `voxora-cli`, `voxora-registry`, and the new
# `voxora-minimax`.
#
# Previous bumps: 0.4.0 (Fase 4 coordinated release), 0.4.2
# (EPIC #100 CI hardening), 0.4.3 (EPIC #109 security
# hardening), 0.5.0 (EPIC #117 coordinated), 0.5.1 (EPIC #124
# coordinated patch), 0.5.2 (additive-exception path; stayed
# pinned because the surface didn't change).
version = "0.6.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration cascade for voxora (cache dir, Hugging Face token, base URL, revision)"
authors.workspace = true
rust-version.workspace = true
# Not `readme.workspace = true`: a workspace-inherited readme resolves
# against the workspace root, and this crate ships its own README
# describing the cascade and the VOXORA_* variables it honours.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
serde        = { workspace = true, features = ["derive"] }
toml         = "0.8"
dirs         = "5"
thiserror    = { version = "2", default-features = false }

[dev-dependencies]
tempfile          = "3"
pretty_assertions = "1"
