[package]
name = "voxora-config"
# Version inherited from `[workspace.package]` (currently 0.4.0).
# The env-var cascade this crate ships is the single source of
# truth for voxora-hf and any future consumer; the 0.4.0 cut is
# the Fase 4 coordinated release that also removes the
# `voxora-core` shim (issue #42).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration cascade for voxora (cache dir, Hugging Face token, base URL, revision)"
authors.workspace = true
rust-version.workspace = true
# Not `readme.workspace = true`: a workspace-inherited readme resolves
# against the workspace root, and this crate ships its own README
# describing the cascade and the VOXORA_* variables it honours.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
serde        = { workspace = true, features = ["derive"] }
toml         = "0.8"
dirs         = "5"
thiserror    = { version = "2", default-features = false }

[dev-dependencies]
tempfile          = "3"
pretty_assertions = "1"
