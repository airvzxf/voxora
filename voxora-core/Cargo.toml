[package]
name = "voxora-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shim around voxora-traits for backwards compatibility"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = []
# Optional serde feature mirrors the one on voxora-traits. Crates that
# enabled `voxora-core/serde` in the past can keep doing so: the
# feature now forwards to voxora-traits and exposes the same derives
# at the same `voxora_core::*` path.
serde = ["voxora-traits/serde"]

[dependencies]
voxora-traits = { workspace = true }
# async-trait / thiserror are still listed so the shim's transitive
# dependency graph is identical to the pre-split voxora-core. The real
# trait lives in voxora-traits; these names are re-exported indirectly
# through voxora_core::* and friends.
async-trait = "0.1"
thiserror   = { version = "2", default-features = false }