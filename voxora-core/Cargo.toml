[package]
name = "voxora-core"
# Hardcoded to 0.3.1: this is the only release where voxora-core
# diverges from `[workspace.package].version`. The deprecation
# warning on the crate signals the upcoming 0.4.0 removal; the
# next workspace-wide bump (which will delete voxora-core entirely
# in #42) cannot accidentally drag voxora-core forward into another
# pre-removal release. See `AGENTS.md` → Version coordination for
# the coordinated-bumps policy and the additive-change exception.
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shim around voxora-traits for backwards compatibility"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = []
# Optional serde feature mirrors the one on voxora-traits. Crates that
# enabled `voxora-core/serde` in the past can keep doing so: the
# feature now forwards to voxora-traits and exposes the same derives
# at the same `voxora_core::*` path.
serde = ["voxora-traits/serde"]

[dependencies]
voxora-traits = { workspace = true }
# async-trait / thiserror are still listed so the shim's transitive
# dependency graph is identical to the pre-split voxora-core. The real
# trait lives in voxora-traits; these names are re-exported indirectly
# through voxora_core::* and friends.
async-trait = "0.1"
thiserror   = { version = "2", default-features = false }