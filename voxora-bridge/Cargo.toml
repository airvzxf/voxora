[package]
name = "voxora-bridge"
# Coordinated bump to 0.5.0 for EPIC #117: the umbrella now
# re-exports `voxora-local` behind the new `local` Cargo feature.
# Every workspace crate that participates in this release ships
# at 0.5.0 per `AGENTS.md` → Version coordination.
#
# 0.4.1 was the previous docs-only patch release; 0.4.2 was the
# EPIC #100 CI hardening coordinated patch; 0.4.3 was the EPIC
# #109 security hardening coordinated patch; 0.4.0 was the Fase
# 4 cut that removed the `voxora-core` shim (issue #42).
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Umbrella crate for voxora — re-exports voxora-traits, voxora-hf, and the engine adapters behind feature flags"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
# Default features give downstream crates (e.g. telora-daemon) both
# engines wired up out of the box. Each engine is also available on
# its own for slimmer binaries.
default = ["whisper", "qwen3asr"]

# Hardware backends. Each forwards to the matching engine feature;
# voxora-bridge stays a pure re-exporter, just one level up.
#
# `cuda` is split per engine because the candle-based qwen3-asr CUDA
# backend pulls in WMMA kernels that require sm_70+ (Volta), whereas
# whisper.cpp's ggml-cuda works back to sm_50 (Pascal-friendly).
# Downstream crates on hardware older than sm_70 should enable
# `cuda-whisper` only and leave `cuda-qwen3asr` off.
cuda           = ["cuda-whisper", "cuda-qwen3asr"]
cuda-whisper   = ["voxora-whisper/cuda"]
cuda-qwen3asr  = ["voxora-qwen3asr/cuda"]
metal          = ["voxora-whisper/metal", "voxora-qwen3asr/metal"]
vulkan         = ["voxora-whisper/vulkan"]   # qwen3-asr has no vulkan backend

# Per-engine toggles.
whisper  = ["dep:voxora-whisper",  "voxora-whisper/hf"]
qwen3asr = ["dep:voxora-qwen3asr", "voxora-qwen3asr/hf"]

# Local-directory `ModelSource` (closes #49 — re-export
# portion). Not in `default` — the canonical happy-path consumer
# (telora-daemon) does not need it; consumers who vendor their own
# weights opt in explicitly. `dep:voxora-local` keeps the
# transitive footprint zero when this feature is off.
local   = ["dep:voxora-local"]

# Cross-engine parity test fixture (EPIC #133, closes #59). The
# `cross_engine_parity` integration test loads both engines and
# checks that their transcripts of the same audio agree within a
# 0.3 WER threshold. It is `#[ignore]`-gated because real model
# weights (~75 MB + ~1.7 GB) are required; it is gated behind
# this explicit feature so a downstream consumer who doesn't want
# both engines wired up stays slim. `voxora-testkit` is a
# dev-dependency unconditionally (Cargo doesn't let you mark
# dev-dependencies optional) and the engine deps are pulled in
# via the feature list.
parity = ["whisper", "qwen3asr"]

[dependencies]
voxora-traits  = { workspace = true }
voxora-hf      = { workspace = true }
voxora-engine  = { workspace = true }
voxora-whisper  = { workspace = true, optional = true }
voxora-qwen3asr = { workspace = true, optional = true }
voxora-local   = { workspace = true, optional = true }
thiserror      = { version = "2", default-features = false }

[dev-dependencies]
hound  = "3.5"
tokio  = { version = "1", features = ["rt-multi-thread", "macros"] }
# EPIC #133 (PR #59): cross-engine parity test pulls in the
# offline WER helper + the (now sync) fixture download from the
# dev-only testkit crate. Workspace path; cargo strips it from
# the published manifest. Cargo does not allow optional
# dev-dependencies, so this is unconditional; the `parity`
# Cargo feature still gates the [[test]] target itself so a
# downstream consumer who doesn't enable both engines does not
# pull the parity test into their build graph.
voxora-testkit = { workspace = true }

[[example]]
name = "bridge_demo"
required-features = ["whisper"]

[[example]]
name = "basic_transcribe"
required-features = ["whisper"]

[[test]]
name = "cross_engine_parity"
required-features = ["parity"]

# Closes #93. docs.rs renders feature-gated items with their
# "Available on crate feature X" badge. `all-features = true` is
# unsafe here because the cuda/metal/vulkan forwards pull
# SDK-gated backends (whisper-rs/cuda needs nvcc; whisper-rs/metal
# needs the Metal SDK; whisper-rs/vulkan needs the Vulkan loader)
# that docs.rs' sandbox lacks — list the doc-safe features
# explicitly instead.
[package.metadata.docs.rs]
features = ["whisper", "qwen3asr", "local"]
rustdoc-args = ["--cfg", "docsrs"]
