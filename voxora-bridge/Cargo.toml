[package]
name = "voxora-bridge"
# Coordinated bump to 0.5.0 for EPIC #117: the umbrella now
# re-exports `voxora-local` (and stays the single entry point for
# downstream crates like telora-daemon). Every workspace crate
# that participates in this release ships at 0.5.0 per
# `AGENTS.md` → Version coordination.
#
# 0.4.1 was the previous docs-only patch release; 0.4.2 was the
# EPIC #100 CI hardening coordinated patch; 0.4.3 was the EPIC
# #109 security hardening coordinated patch; 0.4.0 was the Fase
# 4 cut that removed the `voxora-core` shim (issue #42).
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Umbrella crate for voxora — re-exports voxora-traits, voxora-hf, and the engine adapters behind feature flags"
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
# Default features give downstream crates (e.g. telora-daemon) both
# engines wired up out of the box. Each engine is also available on
# its own for slimmer binaries.
default = ["whisper", "qwen3asr"]

# Hardware backends. Each forwards to the matching engine feature;
# voxora-bridge stays a pure re-exporter, just one level up.
#
# `cuda` is split per engine because the candle-based qwen3-asr CUDA
# backend pulls in WMMA kernels that require sm_70+ (Volta), whereas
# whisper.cpp's ggml-cuda works back to sm_50 (Pascal-friendly).
# Downstream crates on hardware older than sm_70 should enable
# `cuda-whisper` only and leave `cuda-qwen3asr` off.
cuda           = ["cuda-whisper", "cuda-qwen3asr"]
cuda-whisper   = ["voxora-whisper/cuda"]
cuda-qwen3asr  = ["voxora-qwen3asr/cuda"]
metal          = ["voxora-whisper/metal", "voxora-qwen3asr/metal"]
vulkan         = ["voxora-whisper/vulkan"]   # qwen3-asr has no vulkan backend

# Per-engine toggles.
whisper  = ["dep:voxora-whisper",  "voxora-whisper/hf"]
qwen3asr = ["dep:voxora-qwen3asr", "voxora-qwen3asr/hf"]

# Local-directory `ModelSource` (closes #49). Not in `default` —
# the canonical happy-path consumer (telora-daemon) does not need
# it; consumers who vendor their own weights opt in explicitly.
# `dep:voxora-local` keeps the transitive footprint zero when this
# feature is off.
local   = ["dep:voxora-local"]

[dependencies]
voxora-traits  = { workspace = true }
voxora-hf      = { workspace = true }
voxora-engine  = { workspace = true }
voxora-whisper  = { workspace = true, optional = true }
voxora-qwen3asr = { workspace = true, optional = true }
voxora-local   = { workspace = true, optional = true }
thiserror      = { version = "2", default-features = false }

[dev-dependencies]
hound  = "3.5"
tokio  = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "bridge_demo"
required-features = ["whisper"]

[[example]]
name = "basic_transcribe"
required-features = ["whisper"]

# Closes #93. docs.rs renders feature-gated items with their
# "Available on crate feature X" badge. `all-features = true` is
# unsafe here because the cuda/metal/vulkan forwards pull
# SDK-gated backends (whisper-rs/cuda needs nvcc; whisper-rs/metal
# needs the Metal SDK; whisper-rs/vulkan needs the Vulkan loader)
# that docs.rs' sandbox lacks — list the doc-safe features
# explicitly instead.
[package.metadata.docs.rs]
features = ["whisper", "qwen3asr", "local"]
rustdoc-args = ["--cfg", "docsrs"]
