[package]
name = "voxora-backend"
# Explicit 0.5.1 override — does **not** participate in the
# EPIC #133 (0.5.2) coordinated bump. Per `AGENTS.md` § "Version
# coordination" additive-exception path, crates that did not
# change AND are not in the release notes stay at their current
# version. Voxora-backend had no surface change in #134/#135/#136/#138.
# (Previously inherited `[workspace.package]` version; pinned
# here so the workspace can flip to 0.5.2 without dragging this
# crate along.)
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-cutting hardware backend selection for voxora ASR engines"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[features]
default = []
# candle-based hardware detection. Off by default to avoid pulling
# in candle-core's transitive deps for users who don't need it.
# Will become default-on in 0.3.1 once stable.
candle = ["dep:candle-core"]

[dependencies]
voxora-engine = { workspace = true }
thiserror     = { version = "2", default-features = false }

[dependencies.candle-core]
workspace = true
optional = true
default-features = false

[dev-dependencies]
tempfile = "3"

# Closes #93. Only `candle` is gated and `candle-core` is
# buildable on docs.rs' stock sandbox; `all-features = true` is
# safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]