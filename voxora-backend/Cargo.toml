[package]
name = "voxora-backend"
# Version inherited from `[workspace.package]` (currently 0.4.0).
# Cross-cutting hardware backend (CUDA → Metal → CPU dispatcher).
# 0.3.0 added the opt-in `candle` Cargo feature that lets
# `best_device()` and `detect()` use `candle-core`'s runtime probe
# instead of always returning Cpu. 0.4.0 keeps the same opt-in
# surface and removes the `voxora-core` shim from the dependency
# tree (this crate consumes the trait surface via `voxora-engine`,
# which depends on `voxora-traits` directly).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-cutting hardware backend selection for voxora ASR engines"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[features]
default = []
# candle-based hardware detection. Off by default to avoid pulling
# in candle-core's transitive deps for users who don't need it.
# Will become default-on in 0.3.1 once stable.
candle = ["dep:candle-core"]

[dependencies]
voxora-engine = { workspace = true }
thiserror     = { version = "2", default-features = false }

[dependencies.candle-core]
workspace = true
optional = true
default-features = false

[dev-dependencies]
tempfile = "3"

# Closes #93. Only `candle` is gated and `candle-core` is
# buildable on docs.rs' stock sandbox; `all-features = true` is
# safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]