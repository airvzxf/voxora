name: Release

# `on` is quoted ("on") because YAML 1.1 reserves `on`/`off`/`yes`/`no`
# as booleans. Some pipelines in this org still parse with a YAML 1.1
# loader, where `on:` is read as `True: ...` and the whole document is
# then treated as broken (GitHub falls back to the file path as the
# workflow's display name — exactly the symptom that produced issue
# feedback). Quoting is the canonical workaround and is what GitHub's
# own examples use.
"on":
  push:
    # Per-crate SemVer tag. The tag SHAPE stays per-crate
    # (`voxora-<name>-vX.Y.Z`) so the audit trail unambiguously maps
    # one tag → one crate, but the VERSION is coordinated: every
    # workspace crate that participates in the release ships at the
    # same X.Y.Z (see `AGENTS.md` → Version coordination). The
    # operator tags each participating crate separately at the same
    # version. Pattern enforces the shape `voxora-<crate-name>-vX.Y.Z`
    # documented in CONTRIBUTING.md. GitHub tag patterns use glob
    # syntax (`*`/`?`). The `+` quantifier shown in the docs as
    # "one or more of the preceding character" is NOT accepted
    # inside `[...]` character classes — `gh workflow run` rejects
    # the file with HTTP 422 "invalid tags patterns". Strict
    # crate-name / SemVer validation happens later in
    # `validate-tag-input` (bash regex); this glob only needs to
    # match the documented shape without rejecting tags like
    # `voxora-traits-v0.4.0`.
    tags:
      - 'voxora-*-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. voxora-traits-v0.4.0). Must exist on the remote.'
        required: true
        type: string
        # Same shape the `push` tag filter enforces. A malformed
        # dispatch input fails fast in validate-tag-input below
        # instead of producing a confusing `git rev-parse` error
        # mid-build. This is a `regex` string (actionlint warns about
        # it, but `pattern` is documented for string-type inputs on
        # workflow_dispatch — see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_dispatchinputspattern).
        # The character-class `+` here IS valid (this is a regex,
        # not a glob) and gives the strict crate-name + SemVer
        # validation that the looser glob in `on.push.tags` can't.
        pattern: '^voxora-[a-z0-9-]+-v[0-9]+\.[0-9]+\.[0-9]+$'

# Releases need to create a GitHub Release page, but only the
# `publish-github-release` job does — the verify and build jobs only
# read repo contents. Scoping `contents: write` to that single job
# applies the principle of least privilege at the workflow level.
#
# crates.io publishing is handled by `publish-cratesio`, which is
# dispatch-only (the push-trigger path never publishes). That job
# escalates to `id-token: write` at the job scope for the OIDC
# exchange; no other job requests that permission.

# Do not let two release jobs for the same tag run in parallel; the
# second one would race the GitHub Release creation.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Default to least privilege: most workflow jobs only need to read
# repo contents. `publish-github-release` is the single job that
# writes (creating the GitHub Release page) and overrides this with
# `contents: write` at the job scope. `publish-cratesio` overrides
# with `id-token: write` for the OIDC exchange.
permissions:
  contents: read

jobs:
  # Tag-input validator: the `push` trigger filters to
  # `voxora-[a-z0-9-]+-vX.Y.Z` so a manual dispatch could otherwise
  # feed arbitrary strings (`main`, `refs/tags/voxora-…`, leading
  # whitespace, etc.) into `git rev-parse`, producing a confusing
  # failure mid-build. This job runs first and fails fast on a
  # malformed tag name. It also extracts the crate name and version
  # from the tag for downstream jobs.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
      crate_name: ${{ steps.resolve.outputs.CRATE_NAME }}
      version: ${{ steps.resolve.outputs.VERSION }}
    steps:
      - name: Validate tag shape + extract crate name + version
        id: resolve
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          if [[ ! "$TAG" =~ ^voxora-([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: '$TAG' is not voxora-<name>-vX.Y.Z" >&2
            exit 1
          fi
          CRATE_NAME="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          echo "✓ tag=$TAG crate_name=$CRATE_NAME version=$VERSION"
          {
            echo "TAG=${TAG}"
            echo "CRATE_NAME=${CRATE_NAME}"
            echo "VERSION=${VERSION}"
          } >> "$GITHUB_OUTPUT"

  # Tag-reachability guard: enforces the AGENTS.md "tag the trunk
  # merge commit, NOT the branch tip" rule mechanically. If the
  # tag's commit is not an ancestor of origin/main, the workflow
  # fails before any binary is built. Defense in depth — the
  # procedural rule still lives in AGENTS.md; this job is the
  # structural check.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
      main_commit: ${{ steps.resolve.outputs.MAIN_COMMIT }}
    steps:
      - name: Checkout at tag ref
        # Pinning to the ref (mutable) here is intentional — this
        # job's job is to resolve the immutable SHA. The SHA
        # pinning is propagated via `outputs.tag_commit` and
        # applied by `build-release` so a mid-run force-push cannot
        # redirect the build.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "This means the tag was created on a branch tip or a local"
            echo "commit that was later squashed away when the release PR"
            echo "was merged into main. The release would publish an SBOM"
            echo "whose SHA does not correspond to any commit reachable from"
            echo "main, breaking the audit log."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See AGENTS.md 'tag the trunk merge commit, NOT the branch tip'."
          } >&2
          exit 1

  # Tag-signature guard: verifies that the tag was GPG-signed by a
  # key listed in `.github/trusted-signers.asc` before any binary
  # is built or published. The allow-list is fetched from
  # `origin/main` (NOT the tagged tree) so revoking a key on main
  # takes effect on the next release — otherwise the trust anchor
  # is the same object being verified and revocation is
  # structurally impossible. The reachability guard proves the tag
  # points at a real commit; this guard proves a trusted signer
  # cut the release. Defense in depth — the procedural rule still
  # lives in AGENTS.md and CONTRIBUTING.md.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    # Runs in parallel with verify-tag-reachability: only the tag
    # string from validate-tag-input is consumed, not its outputs.
    # Both guards gate build-release so the critical-path cost is
    # bounded.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    steps:
      - name: Checkout at tag ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch allow-lists from origin/main
        # The trust anchor lives on `main`, not on the tagged tree
        # the workflow is verifying. Reading it from the tagged
        # tree makes key revocation ineffective: a compromised key
        # could re-cut a tag pointing at an old commit whose tree
        # still lists that key, and verification would pass.
        # Pinning to a fixed ref (origin/main) closes that gap.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"

          # PGP backend: ASCII-armored public key block.
          # voxora's current signing config uses SSH
          # (`gpg.format = ssh` + `airvzxf@github` ED25519), so the
          # `.asc` file is forward-compatibility for a future PGP
          # migration. It is fetched only if present.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "GPG allow-list fetched from origin/main"
          else
            echo "GPG allow-list absent on origin/main (acceptable; SSH-only signers)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi

          # SSH backend: `git verify-tag` consults
          # `gpg.ssh.allowedsignersfile` for SSH-signed tags.
          # voxora currently uses this path.
          if ! git show "origin/main:.github/trusted-signers" \
              > "$RUNNER_TEMP/trusted/allowed_signers"; then
            echo "ERROR: .github/trusted-signers missing on origin/main" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: .github/trusted-signers is empty on origin/main"; exit 1; }
          echo "SSH allow-list fetched from origin/main"

      - name: Configure git for SSH + GPG signature verification
        # voxora's `gpg.format = ssh` produces SSH signatures (the
        # block above `BEGIN PGP SIGNATURE` is the older PGP form).
        # `git verify-tag` auto-detects which backend the tag used,
        # so this config handles both formats without conditional
        # logic in the verification step.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        # PGP keys are imported only when the tag being verified
        # actually has a `BEGIN PGP SIGNATURE` block (i.e. a future
        # PGP-signed tag). For SSH-signed tags (voxora's current
        # state) the runner never imports the GPG keyring, keeping
        # the documented key-removal path intact.
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git cat-file tag "$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag uses SSH signature — GPG keyring not required"
          fi

      - name: Verify tag signature
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "${TAG}"; then
            echo "✓ ${TAG} is signed by a key in .github/trusted-signers (fetched from origin/main)"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (fetched from origin/main)."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Either the tag is unsigned, or it was signed by a key"
            echo "not on the allow-list."
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#voxora-*-v}'"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See .github/trusted-signers."
          } >&2
          exit 1

  build-release:
    name: 'Build · release artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # `validate-tag-input` is the source of `tag`, `crate_name`, and
    # `version` for the manifest template below. Without it here the
    # `${{ needs.validate-tag-input.outputs.* }}` references evaluate
    # to empty strings at runtime — GitHub does not cross the needs
    # DAG implicitly — and the bundle ends up named `-sbom.cdx.json`
    # with `"tag": ""`, `"crate": ""`, `"version": ""` in the JSON.
    needs: [validate-tag-input, verify-tag-reachability, verify-tag-signature]
    steps:
      - name: Checkout at pinned tag SHA
        # Pinning to the immutable commit SHA (resolved by
        # `verify-tag-reachability` and propagated through the
        # job graph) closes the TOCTOU gap: a tag force-push that
        # arrives mid-workflow cannot redirect checkout away from
        # the commit the two verify jobs just approved.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      - name: Install Rust toolchain
        # Deliberately pinned to 1.98.1 — release artefacts must be
        # byte-reproducible against the same compiler the maintainer
        # signed the SBOM with. Do NOT "fix" this to `stable` to match
        # ci.yml; that file's split is about forward-drift detection,
        # which is irrelevant when cutting a release tag.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1

      - name: Build workspace (release, locked)
        # Cold build by design: GitHub Actions caches are scoped
        # per-ref (https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache),
        # and tag-to-tag restore is forbidden. Adding
        # `Swatinem/rust-cache` here would generate a ~270 MB entry
        # per tag that is never read again. The cold build cost
        # (~5 min per release) is acceptable for 1–2 releases/week.
        # CI on main keeps the cache because cross-branch restore
        # works there.
        run: cargo build --workspace --release --locked

      - name: Generate SBOM (CycloneDX JSON)
        # Anchore's sbom-action builds a CycloneDX JSON in-tree.
        # The default 'docker' build-mode would spin Docker; we
        # use 'auto' which detects cargo and produces a
        # Cargo-aware SBOM.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: voxora.sbom.cdx.json

      - name: Download SBOM into workspace
        # anchore/sbom-action@v0.18.0+ uploads the SBOM as a
        # separate artifact but no longer writes it to the
        # workspace on disk. Pull the SBOM back into the workspace
        # root so the Bundle step can `cp` it next to the
        # manifest. The action's own artifact upload is preserved
        # so the SBOM remains downloadable via the run page.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voxora.sbom.cdx.json
          path: ${{ github.workspace }}/

      - name: Verify SBOM downloaded
        # v8 of actions/download-artifact removed
        # `if-no-files-found`, so we explicitly fail-fast when the
        # SBOM file isn't on disk.
        run: |
          test -f "${{ github.workspace }}/voxora.sbom.cdx.json" \
            || { echo "ERROR: SBOM file missing after download"; exit 1; }

      - name: Bundle release artifacts
        # Voxora has no single binary — it's a workspace of 11
        # crates. The release bundle is the SBOM + a workspace
        # manifest summarizing what changed (tag, crate, version,
        # commit SHAs). The full commit log of what changed is
        # left to the auto-generated release notes.
        env:
          CRATE_NAME: ${{ needs.validate-tag-input.outputs.crate_name }}
          VERSION: ${{ needs.validate-tag-input.outputs.version }}
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          MAIN_COMMIT: ${{ needs.verify-tag-reachability.outputs.main_commit }}
        run: |
          set -euo pipefail
          ART_DIR="${{ runner.temp }}/release-artifacts"
          mkdir -p "$ART_DIR"

          cp "${{ github.workspace }}/voxora.sbom.cdx.json" \
             "$ART_DIR/${TAG}-sbom.cdx.json"

          cat > "$ART_DIR/${TAG}-manifest.json" <<EOF
          {
            "tag": "${TAG}",
            "crate": "${CRATE_NAME}",
            "version": "${VERSION}",
            "tag_commit": "${TAG_COMMIT}",
            "main_commit": "${MAIN_COMMIT}",
            "sbom": "${TAG}-sbom.cdx.json"
          }
          EOF

          ls -la "$ART_DIR"

      - name: Upload bundle for the publisher job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voxora-release-bundle
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

  # Voxora-specific job: emits the publish instructions rendered
  # into the GitHub Release body. The workflow itself publishes
  # via the `publish-cratesio` job (Trusted Publishing / OIDC,
  # dispatch-only) — but only after the operator inspects the
  # release page. This job just renders the instruction text
  # the operator follows to invoke it. Crates with `publish = false`
  # (`voxora-cli`, `voxora-testkit`) get a notice instead of a
  # publish command.
  cargo-publish-suggestion:
    name: 'Render · cargo publish instructions'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    needs: [validate-tag-input, verify-tag-reachability]
    outputs:
      suggestion: ${{ steps.render.outputs.SUGGESTION }}
    steps:
      - name: Render suggestion
        id: render
        env:
          CRATE_NAME: ${{ needs.validate-tag-input.outputs.crate_name }}
          VERSION: ${{ needs.validate-tag-input.outputs.version }}
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "suggestion<<EOF_SUGGESTION"
            case "${CRATE_NAME}" in
              voxora-cli|voxora-testkit)
                echo "## crates.io publish"
                echo ""
                echo "**${CRATE_NAME}** has \`publish = false\` in its Cargo.toml — no crates.io upload."
                echo "The release page exists for the audit trail; nothing to publish."
                echo ""
                echo "## Per-crate publish order"
                echo ""
                echo "Publish the remaining crates in dependency order (already-adjusted for the"
                echo "0.4.0 layout where \`voxora-traits\` is the canonical trait surface)."
                echo ""
                echo "**Partial patch releases** (closes #94): if only a subset of crates is being"
                echo "bumped, publish only those — the \`publish-cratesio\` job now runs a pre-flight"
                echo "check that verifies every internal \`voxora-*\` dep of the tagged crate is"
                echo "already on crates.io at the required semver, and fails fast with an explicit"
                echo "\"publish voxora-X first\" message if not. The dependency-order list below is"
                echo "for the **full coordinated bump** case; partial bumps only need the leaves of"
                echo "the subset to land before their dependents."
                echo ""
                echo '```'
                echo "voxora-traits     (no deps)"
                echo "voxora-config     (no voxora deps; env-var cascade)"
                echo "voxora-engine     (depends on voxora-traits)"
                echo "voxora-hf         (depends on voxora-traits, voxora-config)"
                echo "voxora-backend    (depends on voxora-engine)"
                echo "voxora-whisper    (depends on voxora-traits)"
                echo "voxora-qwen3asr   (depends on voxora-traits)"
                echo "voxora-registry   (depends on voxora-traits, voxora-engine, voxora-hf)"
                echo "voxora-bridge     (depends on voxora-traits, voxora-hf, voxora-engine, voxora-whisper, voxora-qwen3asr)"
                echo "voxora-cli        (publish=false, no upload)"
                echo "voxora-testkit    (publish=false, no upload)"
                echo '```'
                ;;
              *)
                echo "## How to publish this crate"
                echo ""
                echo "Publishing is **dispatch-only** — it does NOT happen automatically on the tag push."
                echo "After confirming the release page above looks correct, invoke the Trusted Publishing"
                echo "job from your terminal:"
                echo ""
                echo '```bash'
                echo "gh workflow run release.yml -f tag=${TAG}"
                echo "gh run watch    # wait for the \`publish-cratesio\` job"
                echo '```'
                echo ""
                echo "Requirements (one-time, per the CONTRIBUTING.md checklist):"
                echo ""
                echo "1. **Trusted Publishing registered on crates.io.** Each publishable crate needs an"
                echo "   entry under crates.io → crate → Settings → Trusted Publishing → Add GitHub"
                echo "   publisher (\`airvzxf\` / \`voxora\` / \`release.yml\`). Until all nine are"
                echo "   registered, the OIDC exchange fails fast."
                echo ""
                echo "2. **Repository workflow permissions allow \`id-token: write\`.** Set under"
                echo "   Settings → Actions → General → Workflow permissions. The \`publish-cratesio\`"
                echo "   job requests \`id-token: write\` at the job scope; without the repo-level"
                echo "   allow, GitHub silently returns an empty token."
                echo ""
                echo "If Trusted Publishing is not yet configured and you need to ship urgently,"
                echo "fall back to a local \`cargo publish -p ${CRATE_NAME} --locked\` against"
                echo "a checkout of tag \`${TAG}\` using your own crates.io API token."
                echo ""
                echo "## Per-crate publish order"
                echo ""
                echo "Publish the workspace crates in this order (already-adjusted for the"
                echo "0.4.0 layout where \`voxora-traits\` is the canonical trait surface)."
                echo ""
                echo "**Partial patch releases** (closes #94): if only a subset of crates is being"
                echo "bumped, publish only those — the \`publish-cratesio\` job now runs a pre-flight"
                echo "check that verifies every internal \`voxora-*\` dep of the tagged crate is"
                echo "already on crates.io at the required semver, and fails fast with an explicit"
                echo "\"publish voxora-X first\" message if not. The dependency-order list below is"
                echo "for the **full coordinated bump** case; partial bumps only need the leaves of"
                echo "the subset to land before their dependents."
                echo ""
                echo '```'
                echo "voxora-traits     (no deps)"
                echo "voxora-config     (no voxora deps; env-var cascade)"
                echo "voxora-engine     (depends on voxora-traits)"
                echo "voxora-hf         (depends on voxora-traits, voxora-config)"
                echo "voxora-backend    (depends on voxora-engine)"
                echo "voxora-whisper    (depends on voxora-traits)"
                echo "voxora-qwen3asr   (depends on voxora-traits)"
                echo "voxora-registry   (depends on voxora-traits, voxora-engine, voxora-hf)"
                echo "voxora-bridge     (depends on voxora-traits, voxora-hf, voxora-engine, voxora-whisper, voxora-qwen3asr)"
                echo "voxora-cli        (publish=false, no upload)"
                echo "voxora-testkit    (publish=false, no upload)"
                echo '```'
                ;;
            esac
            echo "EOF_SUGGESTION"
          } >> "$GITHUB_OUTPUT"

  publish-github-release:
    name: 'Publish · GitHub Release'
    # `validate-tag-input` is required here too: `TAG_NAME` /
    # `VERSION` / `RELEASE_NAME` / `CRATE_NAME` all read from
    # `needs.validate-tag-input.outputs.*`. Without it, GitHub
    # substitutes empty strings and `RELEASE_NAME` becomes just
    # `v - ` (the literal `v` prefix + space + dash + space + empty
    # crate name), which would publish a release titled `v - `.
    # Same root cause as the `build-release` needs gap.
    needs: [validate-tag-input, build-release, cargo-publish-suggestion]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voxora-release-bundle
          path: release/

      - name: Create GitHub Release
        env:
          TAG_NAME: ${{ needs.validate-tag-input.outputs.tag }}
          VERSION: ${{ needs.validate-tag-input.outputs.version }}
          CRATE_NAME: ${{ needs.validate-tag-input.outputs.crate_name }}
          # The Git tag stays per-crate (`voxora-<name>-vX.Y.Z`) so the
          # audit trail remains unambiguous, but the human-readable
          # release title on https://github.com/airvzxf/voxora/releases
          # combines the version with the crate suffix — e.g.
          # `v0.4.0 - traits`, `v0.4.0 - cli`. Without the crate suffix
          # the 11 simultaneous v0.4.0 release pages all share the
          # title `v0.4.0`, which makes the GitHub Release page
          # impossible to scan and (because the GitHub UI groups
          # releases by title) breaks the chronological ordering —
          # `v0.3.1` ends up interleaved with the v0.4.0 batch.
          RELEASE_NAME: v${{ needs.validate-tag-input.outputs.version }} - ${{ needs.validate-tag-input.outputs.crate_name }}
          SUGGESTION: ${{ needs.cargo-publish-suggestion.outputs.suggestion }}
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          # Use auto-generated notes as the base. The
          # cargo-publish-suggestion output is appended below.
          generate_release_notes: true
          body: |
            ${{ env.SUGGESTION }}
          files: |
            release/*.cdx.json
            release/*-manifest.json
          fail_on_unmatched_files: true

  # crates.io Trusted Publishing. Triggered ONLY via
  # `workflow_dispatch` — the push-trigger path above stays
  # audit-only (signed tag → verified release page), so a
  # compromised or accidental tag push can never publish to
  # crates.io. The operator invokes this job explicitly after
  # visually confirming the release page looks right.
  #
  # crates.io offers Trusted Publishing (OIDC) at
  # https://crates.io/docs/trusted-publishing so the workflow
  # can publish without a long-lived API token. The maintainer
  # must register each publishable crate once on crates.io
  # (Settings → Trusted Publishing → Add GitHub publisher);
  # the per-crate checklist lives in CONTRIBUTING.md.
  publish-cratesio:
    name: 'Publish · crates.io (Trusted Publishing / OIDC)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `id-token: write` is the OIDC permission GitHub requires
    # for trusted publishing. Without it `$ACTIONS_ID_TOKEN_REQUEST_TOKEN`
    # is empty and the workflow cannot authenticate to crates.io.
    # All other jobs keep the default `contents: read`; the
    # `publish-github-release` job still uses `contents: write`
    # because it creates the GitHub Release page.
    #
    # `if: github.event_name == 'workflow_dispatch'` is the
    # structural guard that keeps this job dispatch-only. The
    # comment above says "dispatch-only" but the if-line is
    # what enforces it — without it a `git push --tags` of any
    # `voxora-*-v*.*.*` would trigger the full release chain
    # AND publish to crates.io on the same run, which defeats
    # the operator's "visually confirm the release page first"
    # gate.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    needs:
      - validate-tag-input
      - verify-tag-reachability
      - verify-tag-signature
      - build-release
    steps:
      - name: Skip non-publishable crates
        id: skip_check
        env:
          CRATE_NAME: ${{ needs.validate-tag-input.outputs.crate_name }}
        run: |
          set -euo pipefail
          # voxora-cli and voxora-testkit carry `publish = false`.
          # The release tag is still cut (so the audit trail is
          # complete), but no crates.io upload is possible. The
          # case branch is exhaustive (`*)` falls through) so a
          # future `publish = false` member without a branch
          # entry would silently attempt an upload that cargo
          # rejects — keep the list in sync when adding members.
          # NOTE: `CRATE_NAME` is the BARE crate name (e.g.
          # `traits`, `engine`) as captured by the validate-tag-input
          # regex. The skip list below uses the bare form to match.
          case "${CRATE_NAME}" in
            cli|testkit)
              echo "::notice title=skip crates.io publish::voxora-${CRATE_NAME} is publish = false; nothing to do"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "✓ voxora-${CRATE_NAME} is publishable"
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout at pinned tag SHA
        # Same SHA-pinning logic as build-release so a mid-run
        # force-push cannot redirect the publish to a different
        # commit than the one the verify jobs approved.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      - name: Install Rust toolchain
        # Deliberately pinned to 1.98.1 — release artefacts must be
        # byte-reproducible against the same compiler the maintainer
        # signed the SBOM with. Do NOT "fix" this to `stable` to match
        # ci.yml; that file's split is about forward-drift detection,
        # which is irrelevant when cutting a release tag.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1

      - name: Exchange OIDC token for crates.io API token
        # Uses the official `rust-lang/crates-io-auth-action@v1`
        # rather than a hand-rolled curl ceremony. The action
        # handles three subtle details that a hand-rolled
        # implementation always gets wrong:
        # 1. **OIDC audience**: derived from the registry URL by
        #    stripping `https://` → `crates.io` (the dotted
        #    hostname, NOT `crates-io` with a hyphen).
        # 2. **User-Agent header** (`crates-io-auth-action/<ver>`).
        #    Cloudflare in front of crates.io rejects requests
        #    without a `User-Agent` header (verified by direct
        #    curl returning 403 with empty body even for a
        #    malformed JWT — the latent bug a hand-rolled
        #    ceremony always hits).
        # 3. **Error reporting**: parses the `errors.detail`
        #    envelope and surfaces it in `core.setFailed`. Our
        #    hand-rolled version suppressed the body with
        #    `curl -sSf` and only got `curl: (22)` with no
        #    actionable detail.
        # Reference: https://github.com/rust-lang/crates-io-auth-action
        if: steps.skip_check.outputs.skipped != 'true'
        id: trustpub
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Verify internal voxora-* deps are on crates.io (closes #94)
        # Pre-publish guard for partial patch releases. Without
        # this, dispatching `voxora-bridge-v0.4.1` before its
        # bumped dep `voxora-traits-v0.4.1` fails at `cargo
        # publish` time with the unhelpful
        #   failed to select a version for the requirement
        #   voxora-traits = "^0.4.1"
        #   candidate versions found which didn't match
        # error, after the tag has been pushed (irreversible).
        # This step reads the manifest at the pinned tag SHA,
        # extracts every internal `voxora-*` dependency and its
        # required semver, and asks crates.io for each one —
        # failing fast with an explicit "publish voxora-X first"
        # message if any required version is not yet on the
        # index.
        #
        # The crates.io API is unauthenticated and Cloudflare-
        # cached. Cloudflare requires a `User-Agent` header on
        # every request (same caveat as the OIDC step above);
        # a bare curl without `-A` returns 403.
        if: steps.skip_check.outputs.skipped != 'true'
        env:
          CRATE_FULL: voxora-${{ needs.validate-tag-input.outputs.crate_name }}
          UA: 'voxora-release-guard/1.0 (+https://github.com/airvzxf/voxora)'
        run: |
          set -euo pipefail
          # Extract the voxora-* deps this crate declares.
          cargo metadata --format-version=1 --no-deps \
            | jq -r --arg c "${CRATE_FULL}" \
                '.packages[] | select(.name == $c) | .dependencies[]
                 | select(.name | startswith("voxora-")) | "\(.name) \(.req)"' \
            > /tmp/voxora-deps.txt || {
              echo "::error title=cargo metadata failed::could not read workspace manifest at the pinned tag SHA"
              exit 1
            }
          if [ ! -s /tmp/voxora-deps.txt ]; then
            echo "✓ ${CRATE_FULL} has no internal voxora-* deps; nothing to verify"
            exit 0
          fi
          echo "Checking $(wc -l < /tmp/voxora-deps.txt) internal voxora-* dep(s) against crates.io:"
          sed 's/^/    /' /tmp/voxora-deps.txt
          fail=0
          while read -r dep req; do
            # Query the crates.io crate-level API (no version in the
            # path) and check whether ANY of the published versions
            # satisfies the semver requirement. The version-keyed
            # endpoint `/crates/{dep}/{req}` returns 400 on semver
            # ranges like `^0.4.2` (the `^` is not a valid major-
            # version digit), so we have to enumerate. The response
            # is small (<100 KB even for crates with hundreds of
            # versions) and Cloudflare-cached.
            url="https://crates.io/api/v1/crates/${dep}"
            body=$(mktemp)
            code=$(curl -sS -A "${UA}" -o "${body}" -w '%{http_code}' "${url}" || true)
            if [ "${code}" != "200" ]; then
              detail=$(jq -r '.errors[0].detail // "unknown"' < "${body}" 2>/dev/null || echo "unknown")
              echo "::error title=missing internal dep on crates.io::\`${CRATE_FULL}\` requires \`${dep} = ${req}\`, but the crate is not on crates.io at all (HTTP ${code}: ${detail}). Publish \`${dep}\` first, then re-dispatch this workflow."
              fail=1
              rm -f "${body}"
              continue
            fi
            versions_json=$(jq -c '[.versions[].num]' "${body}")
            rm -f "${body}"
            # Pipe every published version through the semver
            # matcher script committed at
            # `.github/scripts/check-cratesio-deps.py`. Supports
            # caret (`^X.Y.Z`), tilde (`~X.Y.Z`), comma ranges
            # (`>=A, <B`), comparison (`>=`, `>`, `<=`, `<`),
            # and exact (`=X.Y.Z` / `X.Y.Z`) operators — every
            # form cargo accepts. `$GITHUB_WORKSPACE` is the
            # checkout root; the script lives at `<root>/.github/`.
            resolved=$(printf '%s\n' "${versions_json}" \
              | jq -r '.[]' \
              | python3 "${GITHUB_WORKSPACE}/.github/scripts/check-cratesio-deps.py" "${req}" \
              || true)
            resolved="${resolved:-}"
            if [ -n "${resolved}" ]; then
              echo "  ✓ ${dep} ${req} satisfied by ${dep} ${resolved} on crates.io"
            else
              echo "::error title=missing internal dep on crates.io::\`${CRATE_FULL}\` requires \`${dep} = ${req}\`, but no published version of \`${dep}\` on crates.io satisfies that requirement. Publish \`${dep}\` at a compatible version first, then re-dispatch this workflow."
              fail=1
            fi
          done < /tmp/voxora-deps.txt
          if [ "${fail}" -ne 0 ]; then
            echo "::error title=aborting publish::one or more internal voxora-* dependencies are missing from crates.io. See the errors above."
            exit 1
          fi
          echo "✓ all internal voxora-* deps present on crates.io"

      - name: cargo publish
        if: steps.skip_check.outputs.skipped != 'true'
        env:
          # `CRATE_NAME` is the BARE crate name (e.g. `traits`)
          # captured by the validate-tag-input regex. `cargo
          # publish -p` needs the full package name as it appears
          # in Cargo.toml (`voxora-traits`), so we prepend the
          # `voxora-` prefix here. The skip-list above uses the
          # bare form to match; this step uses the prefixed form
          # for cargo.
          CARGO_PUBLISH_CRATE: voxora-${{ needs.validate-tag-input.outputs.crate_name }}
          # The token is multi-use server-side (~30 min). cargo
          # accepts the registry-specific env var
          # `CARGO_REGISTRIES_CRATES_IO_TOKEN` for the default
          # crates.io registry, but cargo's own error message
          # ("no token found … or use environment variable
          # CARGO_REGISTRY_TOKEN") is the unambiguous guidance.
          # The value is the RAW token — NO `crates-io:` prefix.
          # cargo auto-revokes it via the action's `post` hook.
          CARGO_REGISTRY_TOKEN: ${{ steps.trustpub.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish -p "${CARGO_PUBLISH_CRATE}" --locked 2>&1 | tee "${{ runner.temp }}/cargo-publish.log"

      - name: Upload publish log
        # Upload ONLY the cargo-publish log, never the
        # credentials file (which still contains the live
        # crates.io API token for ~30 min after a successful
        # publish).
        if: always() && steps.skip_check.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voxora-publish-log
          path: ${{ runner.temp }}/cargo-publish.log
          if-no-files-found: ignore