name: release

on:
  push:
    # Per-crate SemVer tag. Each voxora crate ships its own version;
    # the operator tags each crate separately. Pattern enforces the
    # shape `voxora-<crate-name>-vX.Y.Z` documented in CONTRIBUTING.md.
    tags:
      - 'voxora-[a-z0-9-]+-v[0-9]+\.[0-9]+\.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. voxora-core-v0.2.0). Must exist on the remote.'
        required: true
        type: string
        # Same shape the `push` tag filter enforces. A malformed
        # dispatch input fails fast in validate-tag-input below
        # instead of producing a confusing `git rev-parse` error
        # mid-build.
        pattern: '^voxora-[a-z0-9-]+\-v[0-9]+\.[0-9]+\.[0-9]+$'

# Releases need to create a GitHub Release page, but only the
# `publish-github-release` job does — the verify and build jobs only
# read repo contents. Scoping `contents: write` to that single job
# applies the principle of least privilege at the workflow level.

# Do not let two release jobs for the same tag run in parallel; the
# second one would race the GitHub Release creation.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Default to least privilege: most workflow jobs only need to read
# repo contents. `publish-github-release` is the single job that
# writes (creating the GitHub Release page) and overrides this with
# `contents: write` at the job scope.
permissions:
  contents: read

jobs:
  # Tag-input validator: the `push` trigger filters to
  # `voxora-[a-z0-9-]+-vX.Y.Z` so a manual dispatch could otherwise
  # feed arbitrary strings (`main`, `refs/tags/voxora-…`, leading
  # whitespace, etc.) into `git rev-parse`, producing a confusing
  # failure mid-build. This job runs first and fails fast on a
  # malformed tag name. It also extracts the crate name and version
  # from the tag for downstream jobs.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
      crate_name: ${{ steps.resolve.outputs.CRATE_NAME }}
      version: ${{ steps.resolve.outputs.VERSION }}
    steps:
      - name: Validate tag shape + extract crate name + version
        id: resolve
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          if [[ ! "$TAG" =~ ^voxora-([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: '$TAG' is not voxora-<name>-vX.Y.Z" >&2
            exit 1
          fi
          CRATE_NAME="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          echo "✓ tag=$TAG crate_name=$CRATE_NAME version=$VERSION"
          {
            echo "TAG=${TAG}"
            echo "CRATE_NAME=${CRATE_NAME}"
            echo "VERSION=${VERSION}"
          } >> "$GITHUB_OUTPUT"

  # Tag-reachability guard: enforces the AGENTS.md "tag the trunk
  # merge commit, NOT the branch tip" rule mechanically. If the
  # tag's commit is not an ancestor of origin/main, the workflow
  # fails before any binary is built. Defense in depth — the
  # procedural rule still lives in AGENTS.md; this job is the
  # structural check.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
      main_commit: ${{ steps.resolve.outputs.MAIN_COMMIT }}
    steps:
      - name: Checkout at tag ref
        # Pinning to the ref (mutable) here is intentional — this
        # job's job is to resolve the immutable SHA. The SHA
        # pinning is propagated via `outputs.tag_commit` and
        # applied by `build-release` so a mid-run force-push cannot
        # redirect the build.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "This means the tag was created on a branch tip or a local"
            echo "commit that was later squashed away when the release PR"
            echo "was merged into main. The release would publish an SBOM"
            echo "whose SHA does not correspond to any commit reachable from"
            echo "main, breaking the audit log."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See AGENTS.md 'tag the trunk merge commit, NOT the branch tip'."
          } >&2
          exit 1

  # Tag-signature guard: verifies that the tag was GPG-signed by a
  # key listed in `.github/trusted-signers.asc` before any binary
  # is built or published. The allow-list is fetched from
  # `origin/main` (NOT the tagged tree) so revoking a key on main
  # takes effect on the next release — otherwise the trust anchor
  # is the same object being verified and revocation is
  # structurally impossible. The reachability guard proves the tag
  # points at a real commit; this guard proves a trusted signer
  # cut the release. Defense in depth — the procedural rule still
  # lives in AGENTS.md and CONTRIBUTING.md.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    # Runs in parallel with verify-tag-reachability: only the tag
    # string from validate-tag-input is consumed, not its outputs.
    # Both guards gate build-release so the critical-path cost is
    # bounded.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    steps:
      - name: Checkout at tag ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch allow-lists from origin/main
        # The trust anchor lives on `main`, not on the tagged tree
        # the workflow is verifying. Reading it from the tagged
        # tree makes key revocation ineffective: a compromised key
        # could re-cut a tag pointing at an old commit whose tree
        # still lists that key, and verification would pass.
        # Pinning to a fixed ref (origin/main) closes that gap.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"

          # PGP backend: ASCII-armored public key block.
          # voxora's current signing config uses SSH
          # (`gpg.format = ssh` + `airvzxf@github` ED25519), so the
          # `.asc` file is forward-compatibility for a future PGP
          # migration. It is fetched only if present.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "GPG allow-list fetched from origin/main"
          else
            echo "GPG allow-list absent on origin/main (acceptable; SSH-only signers)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi

          # SSH backend: `git verify-tag` consults
          # `gpg.ssh.allowedsignersfile` for SSH-signed tags.
          # voxora currently uses this path.
          if ! git show "origin/main:.github/trusted-signers" \
              > "$RUNNER_TEMP/trusted/allowed_signers"; then
            echo "ERROR: .github/trusted-signers missing on origin/main" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: .github/trusted-signers is empty on origin/main"; exit 1; }
          echo "SSH allow-list fetched from origin/main"

      - name: Configure git for SSH + GPG signature verification
        # voxora's `gpg.format = ssh` produces SSH signatures (the
        # block above `BEGIN PGP SIGNATURE` is the older PGP form).
        # `git verify-tag` auto-detects which backend the tag used,
        # so this config handles both formats without conditional
        # logic in the verification step.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        # PGP keys are imported only when the tag being verified
        # actually has a `BEGIN PGP SIGNATURE` block (i.e. a future
        # PGP-signed tag). For SSH-signed tags (voxora's current
        # state) the runner never imports the GPG keyring, keeping
        # the documented key-removal path intact.
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git cat-file tag "$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag uses SSH signature — GPG keyring not required"
          fi

      - name: Verify tag signature
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "${TAG}"; then
            echo "✓ ${TAG} is signed by a key in .github/trusted-signers (fetched from origin/main)"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (fetched from origin/main)."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Either the tag is unsigned, or it was signed by a key"
            echo "not on the allow-list."
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#voxora-*-v}'"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See .github/trusted-signers."
          } >&2
          exit 1

  build-release:
    name: 'Build · release artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [verify-tag-reachability, verify-tag-signature]
    steps:
      - name: Checkout at pinned tag SHA
        # Pinning to the immutable commit SHA (resolved by
        # `verify-tag-reachability` and propagated through the
        # job graph) closes the TOCTOU gap: a tag force-push that
        # arrives mid-workflow cannot redirect checkout away from
        # the commit the two verify jobs just approved.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Build workspace (release, locked)
        # Cold build by design: GitHub Actions caches are scoped
        # per-ref (https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache),
        # and tag-to-tag restore is forbidden. Adding
        # `Swatinem/rust-cache` here would generate a ~270 MB entry
        # per tag that is never read again. The cold build cost
        # (~5 min per release) is acceptable for 1–2 releases/week.
        # CI on main keeps the cache because cross-branch restore
        # works there.
        run: cargo build --workspace --release --locked

      - name: Generate SBOM (CycloneDX JSON)
        # Anchore's sbom-action builds a CycloneDX JSON in-tree.
        # The default 'docker' build-mode would spin Docker; we
        # use 'auto' which detects cargo and produces a
        # Cargo-aware SBOM.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: voxora.sbom.cdx.json

      - name: Download SBOM into workspace
        # anchore/sbom-action@v0.18.0+ uploads the SBOM as a
        # separate artifact but no longer writes it to the
        # workspace on disk. Pull the SBOM back into the workspace
        # root so the Bundle step can `cp` it next to the
        # manifest. The action's own artifact upload is preserved
        # so the SBOM remains downloadable via the run page.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voxora.sbom.cdx.json
          path: ${{ github.workspace }}/

      - name: Verify SBOM downloaded
        # v8 of actions/download-artifact removed
        # `if-no-files-found`, so we explicitly fail-fast when the
        # SBOM file isn't on disk.
        run: |
          test -f "${{ github.workspace }}/voxora.sbom.cdx.json" \
            || { echo "ERROR: SBOM file missing after download"; exit 1; }

      - name: Bundle release artifacts
        # Voxora has no single binary — it's a workspace of 11
        # crates. The release bundle is the SBOM + a workspace
        # manifest summarizing what changed (tag, crate, version,
        # commit SHAs). The full commit log of what changed is
        # left to the auto-generated release notes.
        env:
          CRATE_NAME: ${{ needs.validate-tag-input.outputs.crate_name }}
          VERSION: ${{ needs.validate-tag-input.outputs.version }}
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          MAIN_COMMIT: ${{ needs.verify-tag-reachability.outputs.main_commit }}
        run: |
          set -euo pipefail
          ART_DIR="${{ runner.temp }}/release-artifacts"
          mkdir -p "$ART_DIR"

          cp "${{ github.workspace }}/voxora.sbom.cdx.json" \
             "$ART_DIR/${TAG}-sbom.cdx.json"

          cat > "$ART_DIR/${TAG}-manifest.json" <<EOF
          {
            "tag": "${TAG}",
            "crate": "${CRATE_NAME}",
            "version": "${VERSION}",
            "tag_commit": "${TAG_COMMIT}",
            "main_commit": "${MAIN_COMMIT}",
            "sbom": "${TAG}-sbom.cdx.json"
          }
          EOF

          ls -la "$ART_DIR"

      - name: Upload bundle for the publisher job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voxora-release-bundle
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

  # Voxora-specific job: emits the suggested `cargo publish`
  # command for the operator to run manually. The workflow never
  # publishes to crates.io (the `publish = false` crates —
  # voxora-cli, voxora-testkit — are skipped, and the operator
  # controls ordering + secrets). This job just renders the hint
  # into the GitHub Release notes.
  cargo-publish-suggestion:
    name: 'Render · cargo publish suggestion'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    needs: [validate-tag-input, verify-tag-reachability]
    outputs:
      suggestion: ${{ steps.render.outputs.SUGGESTION }}
    steps:
      - name: Render suggestion
        id: render
        env:
          CRATE_NAME: ${{ needs.validate-tag-input.outputs.crate_name }}
          VERSION: ${{ needs.validate-tag-input.outputs.version }}
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "suggestion<<EOF_SUGGESTION"
            echo "## Suggested \`cargo publish\` command"
            echo ""
            echo "Run from a checkout of tag ${TAG}:"
            echo ""
            echo '```bash'
            echo "cargo publish -p ${CRATE_NAME} --allow-dirty"
            echo '```'
            echo ""
            echo "Requires:"
            echo "- \`CARGO_REGISTRY_TOKEN\` secret set with publish rights to crates.io."
            echo "- Per-crate publish order (publish in dependency order):"
            echo ""
            echo '```'
            echo "voxora-core       (no deps)"
            echo "voxora-config     (depends on voxora-core)"
            echo "voxora-engine     (depends on voxora-core)"
            echo "voxora-backend    (depends on voxora-core, voxora-engine)"
            echo "voxora-registry   (depends on voxora-core, voxora-engine, voxora-hf)"
            echo "voxora-hf         (depends on voxora-core)"
            echo "voxora-whisper    (depends on voxora-core)"
            echo "voxora-qwen3asr   (depends on voxora-core)"
            echo "voxora-bridge     (depends on all of the above)"
            echo "voxora-cli        (publish=false, no upload)"
            echo "voxora-testkit    (publish=false, no upload)"
            echo '```'
            echo "EOF_SUGGESTION"
          } >> "$GITHUB_OUTPUT"

  publish-github-release:
    name: 'Publish · GitHub Release'
    needs: [build-release, cargo-publish-suggestion]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voxora-release-bundle
          path: release/

      - name: Create GitHub Release
        env:
          TAG_NAME: ${{ needs.validate-tag-input.outputs.tag }}
          VERSION: ${{ needs.validate-tag-input.outputs.version }}
          # The Git tag stays per-crate (`voxora-<name>-vX.Y.Z`) so the
          # audit trail remains unambiguous, but the human-readable
          # release title on https://github.com/airvzxf/voxora/releases
          # is just the version with the `v` prefix — e.g. `v0.2.0`.
          RELEASE_NAME: v${{ needs.validate-tag-input.outputs.version }}
          SUGGESTION: ${{ needs.cargo-publish-suggestion.outputs.suggestion }}
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          # Use auto-generated notes as the base. The
          # cargo-publish-suggestion output is appended below.
          generate_release_notes: true
          body: |
            ${{ env.SUGGESTION }}
          files: |
            release/*.cdx.json
            release/*-manifest.json
          fail_on_unmatched_files: true
