[graph]
all-features = false

[advisories]
version = 2
# Fail CI on yanked crates (closes #96 — Cargo.lock no longer
# silently pins a yanked transitive like chacha20 0.10.1). Per the
# cargo-deny docs the `yanked` field lives under `[advisories]`
# and accepts `deny` (fail), `warn` (default), `allow` (note).
yanked = "deny"
# h2 0.4.15: unbounded empty DATA frames (transitive via reqwest → rustls).
#   Pinned by reqwest's resolver until upstream updates. Tracking:
#   https://github.com/hyperium/h2/security/advisories
# paste 1.0.15: unmaintained (transitive via qwen3-asr → candle-core).
#   Tracked upstream. We don't ship the affected functionality.
ignore = [
    # h2 0.4.15: unbounded empty DATA frames (transitive via reqwest → rustls).
    #   Pinned by reqwest's resolver until upstream updates.
    "RUSTSEC-2026-0258",
    # paste 1.0.15: unmaintained (transitive via qwen3-asr → candle-core).
    #   We don't ship the affected functionality.
    "RUSTSEC-2024-0436",
    # zip 7.2.0 (transitive via qwen3-asr 0.2.2 → candle-core 0.9.2, which
    #   requires `zip ^7.2.0`; the fix is zip >= 9). candle only opens zip
    #   archives for `.npz` / `.pth` checkpoints, and voxora (and
    #   qwen3-asr) load `.safetensors` exclusively, so that code is never
    #   reached. `ZipArchive::extract` and `ZipStreamReader` are never
    #   called anywhere in the tree, and candle builds zip with
    #   `default-features = false`, so neither `aes-crypto` nor
    #   `legacy-zip` is compiled. Drop these once qwen3-asr moves to
    #   candle-core >= 0.11.1 (the first release on zip 9).
    "RUSTSEC-2026-0367", # SUID/SGID bits preserved on extract
    "RUSTSEC-2026-0368", # extract creates symlinks outside the destination
    "RUSTSEC-2026-0369", # extract applies permissions through symlinks
    "RUSTSEC-2026-0429", # extract aborts on a large symlink entry
    "RUSTSEC-2026-0545", # AES MAC unchecked on truncated entry (`aes-crypto`)
    "RUSTSEC-2026-0546", # extract writes through chained symlinks
    "RUSTSEC-2026-0547", # legacy decoders preallocate declared size (`legacy-zip`)
    "RUSTSEC-2026-0548", # `ZipStreamReader` trusts local-header names
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    # whisper-rs / whisper-rs-sys are Unlicense (Unlicense is OSI-approved
    # public-domain dedication, compatible with Apache-2.0).
    "Unlicense",
    # webpki-root-certs (rustls dep) is CDLA-Permissive-2.0, a
    # Community Data License Agreement variant; non-restrictive.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# libfuzzer-sys bundles LLVM's libFuzzer (NCSA). It is only linked into
# the fuzz harness, which is never published or shipped.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
# thiserror 1.x and 2.x coexist in Cargo.lock (jni → reqwest path
# pulls 1.x; candle → qwen3-asr pulls 2.x). We tolerate the
# duplication because the alternative is forcing a single version
# across an entire upstream tree, which is upstream's responsibility.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies without a version are reported as wildcards. They
# are only allowed in `publish = false` crates (the fuzz harness).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]