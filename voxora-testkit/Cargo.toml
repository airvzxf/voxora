[package]
name = "voxora-testkit"
# Version inherited from `[workspace.package]` — bump there.
# 0.3.0 (Fase 3 PR C): introduced the canonical
# `fixtures::real::resolve_real_fixture` surface so future engine
# parity tests have a single shared entry point. 0.4.0 removes
# the `voxora-core` shim; testkit now consumes `voxora-traits`
# directly.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test helpers for the voxora workspace (offline-only, ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "README.md"

[lib]
# The crate is dev-only; mark the lib target as well so it cannot
# accidentally be required by a downstream crate.
test = false
bench = false

[dependencies]
voxora-traits = { workspace = true }
async-trait = "0.1"
dirs      = "5"
thiserror = { version = "2", default-features = false }
# EPIC #133 (PR #59, follow-up #137): ureq for the real-fixture
# download in `fixtures::real::download`. ureq is sync; the
# function used to be `async` purely to match `voxora-hf`'s
# async surface, but `resolve_real_fixture`'s only callers are
# `#[ignore]`-gated integration tests that already block on a
# tokio runtime, so the async wrapper just added noise.
# `default-features = false` + `features = ["rustls"]` keeps
# the transitive footprint small (no openssl, no native-tls);
# `rustls` already pulls in the internal `_tls` glue (see
# ureq 3.x's `rustls` feature spec, which expands to
# `["rustls-no-provider", "_ring", "rustls-webpki-roots"]`),
# so listing `_tls` explicitly was redundant and relied on an
# internal feature name.
ureq      = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["rt", "macros"] }
