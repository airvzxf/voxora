[package]
name = "voxora-testkit"
# Pinned to 0.2.0: dev-only shared fixtures and mocks. Kept on the
# 0.2.0 coordinated release line so downstream dev-deps stay in
# lock-step with the rest of the workspace.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test helpers for the voxora workspace (offline-only, ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "README.md"

[lib]
# The crate is dev-only; mark the lib target as well so it cannot
# accidentally be required by a downstream crate.
test = false
bench = false

[dependencies]
voxora-core = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
