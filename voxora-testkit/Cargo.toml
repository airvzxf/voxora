[package]
name = "voxora-testkit"
# Version inherited from `[workspace.package]` (currently 0.4.0).
# 0.3.0 (Fase 3 PR C): introduced the canonical
# `fixtures::real::resolve_real_fixture` surface so future engine
# parity tests have a single shared entry point. 0.4.0 removes
# the `voxora-core` shim; testkit now consumes `voxora-traits`
# directly.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test helpers for the voxora workspace (offline-only, ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "README.md"

[lib]
# The crate is dev-only; mark the lib target as well so it cannot
# accidentally be required by a downstream crate.
test = false
bench = false

[dependencies]
voxora-traits = { workspace = true }
async-trait = "0.1"
dirs      = "5"
thiserror = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["rt", "macros"] }
