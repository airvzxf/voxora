[package]
name = "voxora-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test helpers for the voxora workspace (offline-only, ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "README.md"

[lib]
# The crate is dev-only; mark the lib target as well so it cannot
# accidentally be required by a downstream crate.
test = false
bench = false

[dependencies]
voxora-core = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
