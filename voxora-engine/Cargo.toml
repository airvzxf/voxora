[package]
name = "voxora-engine"
# Version inherited from `[workspace.package]` (currently 0.4.2).
# This bumps the crate into lock-step with `voxora-traits`,
# `voxora-backend`, `voxora-bridge`, `voxora-cli`,
# and `voxora-testkit`, restoring the coordinated version policy
# that the 0.3.0 release silently broke for this crate. Closes
# issue #41. No API surface change; the `as_streaming_engine()`
# default-method introduced in the 0.2.0 line remains a
# SemVer-minor addition. After voxora 0.3.1 the trait surface
# is consumed from `voxora-traits`, not the deprecated `voxora-core`
# shim, so this crate depends on `voxora-traits` directly.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical adapter contract for voxora engine crates (ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[dependencies]
voxora-traits = { workspace = true }
thiserror   = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
# EPIC #133 (PR #56): criterion harness for the offline smoke
# bench in `benches/model_capabilities.rs`. Only the core API
# is needed; the gnuplot / plotters feature set is off.
criterion = { workspace = true }

[[bench]]
name = "model_capabilities"
harness = false