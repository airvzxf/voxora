[package]
name = "voxora-engine"
# Version inherited from `[workspace.package]` (currently 0.3.0).
# This bumps the crate into lock-step with `voxora-core`,
# `voxora-traits`, `voxora-backend`, `voxora-bridge`, `voxora-cli`,
# and `voxora-testkit`, restoring the coordinated version policy
# that the 0.3.0 release silently broke for this crate. Closes
# issue #41. No API surface change; the `as_streaming_engine()`
# default-method introduced in the 0.2.0 line remains a
# SemVer-minor addition.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical adapter contract for voxora engine crates (ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[dependencies]
voxora-core = { workspace = true }
thiserror   = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"