[package]
name = "voxora-engine"
# Bumped to 0.6.0 for EPIC #153 (closes #155). New
# `EngineFamily::MiniMax` variant for the first hosted-API
# engine adapter (`voxora-minimax`). The variant is additive at
# the type level (the enum is `#[non_exhaustive]`) but breaks
# downstream exhaustive `match` arms that don't carry a
# wildcard, so this release ships as a coordinated minor bump
# alongside `voxora-bridge`, `voxora-cli`, `voxora-config`,
# `voxora-registry`, and the new `voxora-minimax` crate per
# `AGENTS.md` § "Version coordination".
#
# Previous bumps: 0.4.0 (Fase 4 coordinated release, removed
# `voxora-core` shim), 0.4.2 (EPIC #100 CI hardening), 0.4.3
# (EPIC #109 security hardening), 0.5.0 (EPIC #117
# coordinated), 0.5.1 (EPIC #124 coordinated patch), 0.5.2
# (EPIC #133 quality hardening coordinated patch). This crate
# participated in all of those bumps and continues to track the
# coordinated pin.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical adapter contract for voxora engine crates (ASR-specific)"
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[dependencies]
voxora-traits = { workspace = true }
thiserror   = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
# EPIC #133 (PR #56): criterion harness for the offline smoke
# bench in `benches/model_capabilities.rs`. Only the core API
# is needed; the gnuplot / plotters feature set is off.
criterion = { workspace = true }

[[bench]]
name = "model_capabilities"
harness = false
