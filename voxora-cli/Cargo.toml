[package]
name = "voxora-cli"
# Version inherited from `[workspace.package]` (currently 0.4.0).
# 0.3.0 (historical): removed the deprecated `voxora-cli::BackendKind`
# (paired with voxora-bridge 0.3.0 which removed
# `voxora-bridge::ModelKind`); `--engine` flag parsing now flows
# through `voxora_engine::EngineFamily`. 0.4.0 adds no new public
# surface but bumps the version to align with the Fase 4
# coordinated release.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front-end for the voxora model-agnostic ASR bridge (Phase 5)"
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "voxora"
path = "src/main.rs"

[features]
default = ["cpu", "whisper", "qwen3asr"]
cpu = ["voxora-whisper/cpu", "voxora-qwen3asr/cpu"]
metal = ["voxora-whisper/metal", "voxora-qwen3asr/metal"]
cuda = ["voxora-whisper/cuda", "voxora-qwen3asr/cuda"]
whisper = ["dep:voxora-whisper", "voxora-whisper/hf"]
qwen3asr = ["dep:voxora-qwen3asr", "voxora-qwen3asr/hf"]

[dependencies]
voxora-traits  = { workspace = true }
voxora-hf      = { workspace = true }
voxora-engine  = { workspace = true }
voxora-whisper = { workspace = true, optional = true }
voxora-qwen3asr = { workspace = true, optional = true }
clap           = { version = "4", features = ["derive"] }
hound          = "3.5"
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
thiserror      = { version = "2", default-features = false }
dirs           = "5"

[dev-dependencies]
tempfile        = "3"
ureq            = { version = "3", default-features = false, features = ["_tls", "rustls"] }
wiremock        = "0.6"
pretty_assertions = "1"
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
