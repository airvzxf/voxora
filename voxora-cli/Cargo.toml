[package]
name = "voxora-cli"
# Explicit 0.5.1 override — does **not** participate in the
# EPIC #133 (0.5.2) coordinated bump. Per `AGENTS.md` § "Version
# coordination" additive-exception path, crates that did not
# change AND are not in the release notes stay at their current
# version. Voxora-cli is `publish = false` anyway (no crates.io
# surface) but still tracks the workspace version locally; pinned
# here so the workspace can flip to 0.5.2 without dragging this
# crate along.
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front-end for the voxora model-agnostic ASR bridge (Phase 5)"
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "voxora"
path = "src/main.rs"

[features]
default = ["cpu", "whisper", "qwen3asr"]
cpu = ["voxora-whisper/cpu", "voxora-qwen3asr/cpu"]
metal = ["voxora-whisper/metal", "voxora-qwen3asr/metal"]
cuda = ["voxora-whisper/cuda", "voxora-qwen3asr/cuda"]
# Vulkan is whisper-only — `qwen3-asr` upstream has no Vulkan
# backend (see `voxora-bridge/Cargo.toml` for the same shape).
# Pair with the `whisper` feature so the binary actually wires
# voxora-whisper's Vulkan ggml backend; the flag also surfaces via
# `voxora run --hardware vulkan` for runtime validation. Closes #121.
vulkan = ["voxora-whisper/vulkan"]
whisper = ["dep:voxora-whisper", "voxora-whisper/hf"]
qwen3asr = ["dep:voxora-qwen3asr", "voxora-qwen3asr/hf"]

[dependencies]
voxora-traits  = { workspace = true }
voxora-hf      = { workspace = true }
voxora-engine  = { workspace = true }
voxora-whisper = { workspace = true, optional = true }
voxora-qwen3asr = { workspace = true, optional = true }
clap           = { version = "4", features = ["derive"] }
hound          = "3.5"
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
thiserror      = { version = "2", default-features = false }
dirs           = "5"

[dev-dependencies]
tempfile        = "3"
ureq            = { version = "3", default-features = false, features = ["_tls", "rustls"] }
wiremock        = "0.6"
pretty_assertions = "1"
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
